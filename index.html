<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RapidPack Admin - Despacho Pro 🚚</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --rp-red: #ff3d00; --rp-black: #0b0b0b; --rp-grey: #1a1a1b; --rp-green: #00c853; }
        body { margin: 0; background: var(--rp-black); color: white; font-family: 'Segoe UI', sans-serif; }
        header { padding: 15px 30px; background: #000; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--rp-red); }
        main { padding: 20px; max-width: 1100px; margin: auto; display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
        .card { background: var(--rp-grey); border-radius: 12px; padding: 20px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        /* BUSCADOR */
        .search-box { width: 100%; padding: 15px; background: #222; border: 2px solid #444; color: white; border-radius: 8px; font-size: 18px; box-sizing: border-box; }
        #cliente-seleccionado { display: none; margin-top: 20px; padding: 15px; background: #222; border-radius: 10px; border: 1px dashed #444; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-ubi { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 10px; text-transform: uppercase; }
        .btn-casa { background: #3498db; }
        .btn-trabajo { background: #9b59b6; }
        .btn-temp { background: #f39c12; }
        .btn-ubi:disabled { background: #444; cursor: not-allowed; opacity: 0.2; }

        /* BOTONES REPORTES */
        .btn-wa-group { width: 100%; background: #25d366; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* FORMULARIO */
        label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; font-weight: bold; }
        .f-row { display: flex; gap: 8px; margin-bottom: 8px; }
        input { background: #111; border: 1px solid #333; color: white; padding: 10px; border-radius: 6px; flex: 1; font-size: 13px; }
        .form-section { padding: 10px; background: #222; border-radius: 8px; border-left: 3px solid #444; margin-bottom: 10px; }

        /* BORRADOR */
        .item-draft { background: #252526; padding: 10px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--rp-red); font-size: 14px; }
    </style>
</head>
<body>

<header>
    <h2 style="color: var(--rp-red); margin:0;">RAPIDPACK ADMIN</h2>
    <button style="background:var(--rp-grey); color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:bold;" onclick="location.href='despacho.html'">🖥️ MONITOR RADAR</button>
</header>

<main>
    <div class="card">
        <h3 style="margin:0 0 15px 0; color:var(--rp-red);">🔍 Buscar Cliente</h3>
        <input type="text" id="buscador" class="search-box" placeholder="Escribe nombre..." oninput="buscar()">
        
        <div id="cliente-seleccionado">
            <h2 id="view-nombre" style="margin:0; font-size:18px; color:white;"></h2>
            <div class="btn-group">
                <button id="btn-casa" class="btn-ubi btn-casa" onclick="addParada('CASA')">🏠 CASA</button>
                <button id="btn-trabajo" class="btn-ubi btn-trabajo" onclick="addParada('TRABAJO')">💼 TRABAJO</button>
                <button id="btn-temp" class="btn-ubi btn-temp" onclick="addParada('TEMPORAL')">⏳ TEMPORAL</button>
            </div>
        </div>

        <div id="card-borrador" style="display:none; margin-top:20px; border-top:1px solid #333; padding-top:20px;">
            <h3 style="margin:0 0 10px 0;">📄 Ruta del Día</h3>
            <div id="lista-borrador" style="max-height: 250px; overflow-y: auto; margin-bottom:15px;"></div>
            
            <button class="btn-wa-group" onclick="generarReporteEmpresa()">
                📱 GENERAR MENSAJE PARA EL CHAT
            </button>
            
            <button style="width:100%; background:var(--rp-green); border:none; padding:15px; font-weight:bold; border-radius:8px; cursor:pointer; font-size: 16px;" onclick="lanzarRuta()">
                🚀 LANZAR A MONITOR DESPACHO
            </button>
        </div>
    </div>

    <div class="card">
        <h3 style="margin:0 0 15px 0; color:#aaa;">➕ Registrar / Actualizar</h3>
        <div class="f-row">
            <div style="flex:2"><label>Nombre del Cliente</label><input type="text" id="n-nombre"></div>
            <div style="flex:1"><label>WhatsApp</label><input type="tel" id="n-telefono" placeholder="8091234567"></div>
        </div>

        <div class="form-section" style="border-left-color: #3498db;">
            <label>🏠 1. CASA (lat / lng)</label>
            <div class="f-row"><input type="number" step="any" id="n-lat" placeholder="Latitud"><input type="number" step="any" id="n-lng" placeholder="Longitud"></div>
        </div>

        <div class="form-section" style="border-left-color: #9b59b6;">
            <label>💼 2. TRABAJO (lat_2 / lng_2)</label>
            <div class="f-row"><input type="number" step="any" id="n-lat-2" placeholder="Latitud"><input type="number" step="any" id="n-lng-2" placeholder="Longitud"></div>
        </div>

        <div class="form-section" style="border-left-color: #f39c12;">
            <label>⏳ 3. TEMPORAL (lat_temp / lng_temp)</label>
            <div class="f-row"><input type="number" step="any" id="n-lat-temp" placeholder="Latitud"><input type="number" step="any" id="n-lng-temp" placeholder="Longitud"></div>
        </div>

        <button onclick="guardarNuevo()" style="width:100%; background:var(--rp-red); color:white; border:none; padding:15px; border-radius:8px; font-weight:bold; cursor:pointer;">💾 GUARDAR EN SISTEMA</button>
    </div>
</main>

<script>
    const db = supabase.createClient("https://trdfieobkewwjhzxwpxc.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk");

    let clientesRaw = [];
    let borrador = [];
    let clienteActivo = null;

    async function init() {
        const { data } = await db.from('clientes').select('*');
        clientesRaw = data || [];
    }

    function getSaludo() {
        const h = new Date().getHours();
        if (h < 12) return "Buenos días";
        if (h < 18) return "Buenas tardes";
        return "Buenas noches";
    }

    function buscar() {
        const txt = document.getElementById('buscador').value.toLowerCase();
        const display = document.getElementById('cliente-seleccionado');
        if (txt.length < 2) { display.style.display = 'none'; return; }
        
        clienteActivo = clientesRaw.find(c => c.nombre && c.nombre.toLowerCase().includes(txt));
        if (clienteActivo) {
            display.style.display = 'block';
            document.getElementById('view-nombre').innerText = clienteActivo.nombre;
            
            // CORRECCIÓN: Usar lat (Casa), lat_2 (Trabajo), lat_temp (Temporal)
            document.getElementById('btn-casa').disabled = !clienteActivo.lat;
            document.getElementById('btn-trabajo').disabled = !clienteActivo.lat_2;
            document.getElementById('btn-temp').disabled = !clienteActivo.lat_temp;
        } else { display.style.display = 'none'; }
    }

    function addParada(tipo) {
        let lat, lng;
        if (tipo === 'CASA') { lat = clienteActivo.lat; lng = clienteActivo.lng; }
        else if (tipo === 'TRABAJO') { lat = clienteActivo.lat_2; lng = clienteActivo.lng_2; }
        else { lat = clienteActivo.lat_temp; lng = clienteActivo.lng_temp; }

        borrador.push({ nombre: clienteActivo.nombre, ubi: tipo, lat, lng });
        document.getElementById('buscador').value = '';
        document.getElementById('cliente-seleccionado').style.display = 'none';
        actualizarBorradorUI();
    }

    function actualizarBorradorUI() {
        document.getElementById('card-borrador').style.display = borrador.length > 0 ? 'block' : 'none';
        document.getElementById('lista-borrador').innerHTML = borrador.map((item, i) => `
            <div class="item-draft">
                <span><b>${i+1}.</b> ${item.nombre}</span>
                <button style="background:none; border:none; color:#ff5555; cursor:pointer;" onclick="borrador.splice(${i},1); actualizarBorradorUI()">✕</button>
            </div>
        `).join('');
    }

    function generarReporteEmpresa() {
        if (borrador.length === 0) return;
        const saludo = getSaludo();
        
        // FORMATO EXACTO SOLICITADO
        let msg = `${saludo} equipo, ruta para hoy:\n\n`;
        borrador.forEach((p, i) => { 
            msg += `${i + 1}. ${p.nombre}\n`; 
        });

        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    async function lanzarRuta() {
        if (!confirm("¿Enviar esta ruta al despacho?")) return;
        await db.from('ruta_activa').delete().neq('id', -1);
        const paradas = borrador.map((p, i) => ({ 
            id: i, 
            nombre: `${p.nombre} (${p.ubi})`, 
            lat: p.lat, 
            lng: p.lng, 
            orden: i+1, 
            estado: 'Pendiente' 
        }));
        await db.from('ruta_activa').insert(paradas);
        location.href = 'despacho.html';
    }

    async function guardarNuevo() {
        const nombre = document.getElementById('n-nombre').value;
        const datos = {
            nombre,
            telefono: document.getElementById('n-telefono').value,
            lat: document.getElementById('n-lat').value || null,
            lng: document.getElementById('n-lng').value || null,
            lat_2: document.getElementById('n-lat-2').value || null,
            lng_2: document.getElementById('n-lng-2').value || null,
            lat_temp: document.getElementById('n-lat-temp').value || null,
            lng_temp: document.getElementById('n-lng-temp').value || null
        };
        if (!nombre) return alert("Nombre obligatorio");
        await db.from('clientes').insert([datos]);
        alert("Guardado"); location.reload();
    }

    init();
</script>
</body>
</html>
