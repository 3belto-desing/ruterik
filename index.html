<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin RapidPack - Buscador de Clientes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --rp-red: #ff3d00; --rp-black: #0b0b0b; --rp-grey: #1a1a1b; --rp-green: #00c853; }
        body { margin: 0; background: var(--rp-black); color: white; font-family: 'Segoe UI', sans-serif; }
        
        header { padding: 15px 30px; background: #000; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--rp-red); }
        
        main { padding: 20px; max-width: 800px; margin: auto; }
        .card { background: var(--rp-grey); border-radius: 12px; padding: 20px; border: 1px solid #333; margin-bottom: 20px; }

        /* BUSCADOR */
        .search-box { width: 100%; padding: 15px; background: #222; border: 2px solid #444; color: white; border-radius: 8px; font-size: 18px; box-sizing: border-box; }
        .search-box:focus { border-color: var(--rp-red); outline: none; }
        
        /* RESULTADO DEL CLIENTE */
        #cliente-seleccionado { display: none; margin-top: 20px; animation: fadeIn 0.3s; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-ubi { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 12px; }
        .btn-casa { background: #3498db; }
        .btn-trabajo { background: #9b59b6; }
        .btn-temp { background: #f39c12; }
        .btn-ubi:disabled { background: #444; cursor: not-allowed; opacity: 0.5; }

        /* BORRADOR DE RUTA */
        .item-draft { background: #252526; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--rp-red); }
        .btn-del { background: none; border: none; color: #ff5555; cursor: pointer; font-weight: bold; }

        /* FORMULARIO NUEVO CLIENTE */
        .f-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input[type="text"], input[type="number"] { background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; flex: 1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <h2 style="color: var(--rp-red); margin:0;">RAPIDPACK ADMIN</h2>
    <button style="background:var(--rp-grey); color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;" onclick="location.href='despacho.html'">🖥️ Ir al Radar</button>
</header>

<main>
    <div class="card">
        <h3>🔍 Buscar Cliente (Nombre o RP)</h3>
        <input type="text" id="buscador" class="search-box" placeholder="Escribe para buscar..." oninput="buscar()">
        
        <div id="cliente-seleccionado">
            <h2 id="view-nombre" style="margin-bottom:5px; color:var(--rp-red);"></h2>
            <p style="margin:0; font-size:12px; color:#aaa;">Selecciona el destino para la ruta:</p>
            <div class="btn-group">
                <button id="btn-casa" class="btn-ubi btn-casa" onclick="addParada('casa')">🏠 CASA</button>
                <button id="btn-trabajo" class="btn-ubi btn-trabajo" onclick="addParada('trabajo')">💼 TRABAJO</button>
                <button id="btn-temp" class="btn-ubi btn-temp" onclick="addParada('temporal')">⏳ TEMPORAL</button>
            </div>
        </div>
    </div>

    <div class="card" id="card-borrador" style="display:none;">
        <h3>📄 Ruta para enviar</h3>
        <div id="lista-borrador"></div>
        <button style="width:100%; background:var(--rp-green); border:none; color:black; padding:15px; font-weight:bold; border-radius:8px; margin-top:15px; cursor:pointer;" onclick="lanzarRuta()">🚀 LANZAR A FLOTA AHORA</button>
    </div>

    <div class="card">
        <h4 style="margin-top:0; border-bottom:1px solid #333; padding-bottom:10px;">➕ Registrar Nuevo Cliente</h4>
        <div class="f-row"><input type="text" id="n-nombre" placeholder="Nombre completo"></div>
        <p style="font-size:11px; color:var(--rp-red); margin:5px 0;">Coordenadas Casa (Lat, Lng):</p>
        <div class="f-row">
            <input type="number" step="any" id="n-lat-c" placeholder="Latitud">
            <input type="number" step="any" id="n-lng-c" placeholder="Longitud">
        </div>
        <button onclick="guardarNuevo()" style="width:100%; background:var(--rp-red); color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">GUARDAR EN BASE DE DATOS</button>
    </div>
</main>

<script>
    const db = supabase.createClient("https://trdfieobkewwjhzxwpxc.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk");

    let clientesRaw = [];
    let borrador = [];
    let clienteActivo = null;

    // Cargar datos iniciales
    async function init() {
        const { data } = await db.from('clientes').select('*');
        clientesRaw = data || [];
    }

    function buscar() {
        const txt = document.getElementById('buscador').value.toLowerCase();
        const display = document.getElementById('cliente-seleccionado');
        
        if (txt.length < 2) { display.style.display = 'none'; return; }

        clienteActivo = clientesRaw.find(c => c.nombre.toLowerCase().includes(txt));

        if (clienteActivo) {
            display.style.display = 'block';
            document.getElementById('view-nombre').innerText = clienteActivo.nombre;
            
            // Habilitar botones solo si tienen coordenadas
            document.getElementById('btn-casa').disabled = !clienteActivo.lat_casa;
            document.getElementById('btn-trabajo').disabled = !clienteActivo.lat_trabajo;
            document.getElementById('btn-temp').disabled = !clienteActivo.lat_temporal;
        } else {
            display.style.display = 'none';
        }
    }

    function addParada(tipo) {
        if (!clienteActivo) return;
        const lat = clienteActivo[`lat_${tipo}`];
        const lng = clienteActivo[`lng_${tipo}`];

        borrador.push({ nombre: `${clienteActivo.nombre} (${tipo.toUpperCase()})`, lat, lng });
        
        document.getElementById('buscador').value = '';
        document.getElementById('cliente-seleccionado').style.display = 'none';
        actualizarBorradorUI();
    }

    function actualizarBorradorUI() {
        const card = document.getElementById('card-borrador');
        const lista = document.getElementById('lista-borrador');
        
        card.style.display = borrador.length > 0 ? 'block' : 'none';
        lista.innerHTML = borrador.map((item, i) => `
            <div class="item-draft">
                <span><b>${i+1}.</b> ${item.nombre}</span>
                <button class="btn-del" onclick="borrador.splice(${i},1); actualizarBorradorUI()">X</button>
            </div>
        `).join('');
    }

    async function lanzarRuta() {
        if (!confirm("¿Enviar esta ruta al monitor de despacho?")) return;
        
        // Limpiar ruta activa vieja
        await db.from('ruta_activa').delete().neq('id', -1);

        const paradas = borrador.map((p, i) => ({
            id: i, nombre: p.nombre, lat: p.lat, lng: p.lng, orden: i+1, estado: 'Pendiente'
        }));

        await db.from('ruta_activa').insert(paradas);
        alert("¡Ruta lanzada a la flota!");
        location.href = 'despacho.html';
    }

    async function guardarNuevo() {
        const nombre = document.getElementById('n-nombre').value;
        const lat_casa = document.getElementById('n-lat-c').value;
        const lng_casa = document.getElementById('n-lng-c').value;

        if (!nombre || !lat_casa) return alert("Nombre y coordenadas son obligatorios");

        const { error } = await db.from('clientes').insert([{ nombre, lat_casa, lng_casa }]);
        
        if (error) {
            alert("Error al guardar: " + error.message);
        } else {
            alert("Cliente guardado con éxito");
            location.reload(); // Recargar para que aparezca en el buscador
        }
    }

    // Cerrar buscador con ESC
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.getElementById('buscador').value = '';
            document.getElementById('cliente-seleccionado').style.display = 'none';
        }
    });

    init();
</script>
</body>
</html>
