<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RapidPack Admin - Centro de Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --rp-red: #ff3d00; --rp-black: #0b0b0b; --rp-grey: #1a1a1b; --rp-green: #00c853; }
        body { margin: 0; background: var(--rp-black); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        header { padding: 15px 30px; background: #000; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--rp-red); }
        .btn-nav { background: var(--rp-grey); color: white; border: 1px solid #333; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-main { background: var(--rp-red); color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Contenedor Principal */
        main { display: flex; flex: 1; padding: 20px; gap: 20px; overflow: hidden; }
        .card { background: var(--rp-grey); border-radius: 12px; padding: 20px; border: 1px solid #333; }
        
        /* Creador de Rutas */
        .ruta-box { flex: 2; display: flex; flex-direction: column; gap: 15px; }
        .input-group { display: flex; gap: 10px; }
        select, input { background: #222; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; flex: 1; }

        /* Modal Clientes (Landing) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-content { background: var(--rp-grey); width: 90%; max-width: 1000px; height: 80vh; border-radius: 15px; border: 1px solid var(--rp-red); display: flex; flex-direction: column; padding: 25px; }
        .search-bar { width: 100%; padding: 15px; margin-bottom: 20px; font-size: 16px; box-sizing: border-box; }
        .table-wrap { flex: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #000; color: var(--rp-red); position: sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid #333; font-size: 14px; }

        /* Items de Borrador */
        .item-draft { background: #252526; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; border-left: 4px solid var(--rp-red); }
    </style>
</head>
<body>

<header>
    <h2 style="color: var(--rp-red); margin:0;">RAPIDPACK LOGISTICS</h2>
    <div style="display:flex; gap:10px;">
        <button class="btn-nav" onclick="location.href='despacho.html'">🖥️ Monitor Radar</button>
        <button class="btn-main" onclick="abrirClientes()">👥 Clientes</button>
    </div>
</header>

<main>
    <div class="ruta-box card">
        <h3>🚀 Lanzar Flota</h3>
        <div class="input-group">
            <select id="sel-cliente"><option>Cargando clientes...</option></select>
            <select id="sel-ubi" style="max-width: 150px;">
                <option value="casa">🏠 Casa</option>
                <option value="trabajo">💼 Trabajo</option>
                <option value="temporal">⏳ Temporal</option>
            </select>
            <button class="btn-main" onclick="agregarABorrador()">+ Añadir</button>
        </div>
        <div id="borrador" style="flex:1; overflow-y:auto;">
            </div>
        <button class="btn-main" style="background: var(--rp-green); width: 100%; height: 50px;" onclick="lanzarRuta()">LANZAR A FLOTA AHORA</button>
    </div>
</main>

<div id="modalClientes" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Base de Datos de Clientes</h2>
            <button class="btn-main" onclick="nuevoCliente()">+ Nuevo Cliente</button>
        </div>
        <input type="text" id="buscador" class="search-bar" placeholder="Buscar por nombre (Presiona ESC para salir)...">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Nombre</th><th>📍 Casa</th><th>💼 Trabajo</th><th>⏳ Temp</th><th>Acción</th></tr>
                </thead>
                <tbody id="lista-clientes"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const db = supabase.createClient("https://trdfieobkewwjhzxwpxc.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk");

    let clientesRaw = [];
    let borradorRuta = [];

    // --- FUNCIONES DEL MODAL ---
    function abrirClientes() { document.getElementById('modalClientes').style.display = 'flex'; cargarClientes(); }
    function cerrarClientes() { document.getElementById('modalClientes').style.display = 'none'; }

    // Cerrar con ESC
    window.addEventListener('keydown', (e) => { if(e.key === 'Escape') cerrarClientes(); });

    async function cargarClientes() {
        const { data } = await db.from('clientes').select('*').order('nombre');
        clientesRaw = data || [];
        renderizarTabla(clientesRaw);
        
        const sel = document.getElementById('sel-cliente');
        sel.innerHTML = clientesRaw.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
    }

    function renderizarTabla(lista) {
        document.getElementById('lista-clientes').innerHTML = lista.map(c => `
            <tr>
                <td><b>${c.nombre}</b></td>
                <td>${c.lat_casa ? '✅' : '❌'}</td>
                <td>${c.lat_trabajo ? '✅' : '❌'}</td>
                <td>${c.lat_temporal ? '✅' : '❌'}</td>
                <td><button onclick="editar('${c.id}')">✏️</button></td>
            </tr>
        `).join('');
    }

    // Buscador
    document.getElementById('buscador').addEventListener('input', (e) => {
        const bus = e.target.value.toLowerCase();
        const filtrados = clientesRaw.filter(c => c.nombre.toLowerCase().includes(bus));
        renderizarTabla(filtrados);
    });

    // --- GESTIÓN DE RUTA ---
    function agregarABorrador() {
        const id = document.getElementById('sel-cliente').value;
        const ubi = document.getElementById('sel-ubi').value;
        const c = clientesRaw.find(x => x.id === id);
        
        let lat = c[`lat_${ubi}`], lng = c[`lng_${ubi}`];
        if(!lat) return alert("Este cliente no tiene esa dirección guardada");

        borradorRuta.push({ nombre: `${c.nombre} (${ubi})`, lat, lng });
        actualizarBorradorUI();
    }

    function actualizarBorradorUI() {
        document.getElementById('borrador').innerHTML = borradorRuta.map((r, i) => `
            <div class="item-draft">
                <span>${i+1}. ${r.nombre}</span>
                <button onclick="borradorRuta.splice(${i},1); actualizarBorradorUI()">🗑️</button>
            </div>
        `).join('');
    }

    async function lanzarRuta() {
        await db.from('ruta_activa').delete().neq('id', -1);
        const paradas = borradorRuta.map((r, i) => ({
            id: i, nombre: r.nombre, lat: r.lat, lng: r.lng, orden: i+1, estado: 'Pendiente'
        }));
        await db.from('ruta_activa').insert(paradas);
        alert("¡Ruta lanzada!");
        location.href = 'despacho.html';
    }

    cargarClientes();
</script>
</body>
</html>
