<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ruterik - Centro de Despacho</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --rp-red: #ff3d00;
            --rp-green: #00c853;
            --bg-body: #0b0b0b;
            --bg-card: #1a1a1b;
            --bg-input: #111;
            --bg-header: #000;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border: #333333;
        }
        body.light-mode {
            --bg-body: #f4f4f9;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --bg-header: #ffffff;
            --text-main: #1a1a1b;
            --text-muted: #666666;
            --border: #dddddd;
        }
        body {
            margin: 0;
            background: var(--bg-body);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            transition: 0.3s;
        }
        #login-box {
            max-width: 400px;
            margin: 100px auto;
            background: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        #login-box input { width: 100%; margin-bottom: 15px; box-sizing: border-box; }
        #login-box button { width: 100%; background: var(--rp-red); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        header { padding: 15px 30px; background: var(--bg-header); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--rp-red); }
        main { padding: 20px; max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 12px; padding: 20px; border: 1px solid var(--border); position: relative; }
        .theme-toggle { background: var(--border); border: none; color: var(--text-main); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 13px; }
        .search-box { width: 100%; padding: 15px; background: var(--bg-input); border: 2px solid var(--border); color: var(--text-main); border-radius: 8px; font-size: 18px; box-sizing: border-box; }
        #cliente-seleccionado { display: none; margin-top: 15px; padding: 15px; background: var(--bg-input); border-radius: 10px; border: 1px dashed var(--border); position: relative; }
        .btn-edit { position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 18px; cursor: pointer; color: #f39c12; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-ubi { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 10px; text-transform: uppercase; }
        .btn-casa { background: #3498db; }
        .btn-trabajo { background: #9b59b6; }
        .btn-temp { background: #f39c12; }
        #reporte-texto { width: 100%; height: 160px; background: #000; color: var(--rp-green); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: monospace; resize: none; margin-top: 10px; }
        .item-draft { background: var(--bg-input); padding: 10px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--rp-red); }
        label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; font-weight: bold; }
        .f-row { display: flex; gap: 8px; margin-bottom: 8px; }
        input { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); padding: 10px; border-radius: 6px; flex: 1; font-size: 13px; }
        .form-section { padding: 10px; background: var(--bg-body); border-radius: 8px; border-left: 3px solid var(--border); margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="login-box">
    <h2 style="color:var(--rp-red)">RUTERIK</h2>
    <h3 style="margin-bottom:20px">Iniciar sesión</h3>
    <input type="email" id="email" placeholder="Correo">
    <input type="password" id="password" placeholder="Contraseña">
    <button onclick="login()">ENTRAR</button>
</div>

<div id="admin-content" style="display:none;">
    <header>
        <h2 style="color: var(--rp-red); margin:0;">RUTERIK ADMIN</h2>
        <div style="display:flex; gap:10px;">
            <button class="theme-toggle" onclick="toggleTheme()">Modo</button>
        </div>
    </header>
    <main>
        <div class="card">
            <h3>Buscar cliente</h3>
            <input type="text" id="buscador" class="search-box" placeholder="Nombre..." oninput="buscar()">
            
            <div id="cliente-seleccionado">
                <button class="btn-edit" onclick="cargarEdicion()">✏️</button>
                <h2 id="view-nombre" style="margin:0; font-size:18px;"></h2>
                <div class="btn-group">
                    <button id="btn-casa" class="btn-ubi btn-casa" onclick="addParada('CASA')">CASA</button>
                    <button id="btn-trabajo" class="btn-ubi btn-trabajo" onclick="addParada('TRABAJO')">TRABAJO</button>
                    <button id="btn-temp" class="btn-ubi btn-temp" onclick="addParada('TEMPORAL')">TEMP</button>
                </div>
            </div>

            <div id="card-borrador" style="display:none; margin-top:20px; border-top:1px solid var(--border); padding-top:20px;">
                <h3>Optimización de Ruta</h3>
                <button onclick="ejecutarOptimizacion()" style="width:100%; background:var(--rp-red); color:white; border:none; padding:15px; font-weight:bold; border-radius:8px; cursor:pointer; margin-bottom:10px;">
                    OPTIMIZAR Y GENERAR MENSAJE
                </button>
                <textarea id="reporte-texto" readonly placeholder="El mensaje aparecerá aquí al optimizar..."></textarea>
                <div id="lista-borrador" style="margin-top:15px; max-height: 200px; overflow-y: auto;"></div>
            </div>
        </div>

        <div class="card">
            <h3 id="form-titulo">Registro de cliente</h3>
            <div class="f-row">
                <div style="flex:2"><label>Nombre</label><input type="text" id="n-nombre"></div>
                <div style="flex:1"><label>Codigo RP</label><input type="text" id="n-codigo"></div>
            </div>
            <div class="form-section"><label>CASA</label><div class="f-row"><input type="number" step="any" id="n-lat" placeholder="Lat"><input type="number" step="any" id="n-lng" placeholder="Lng"></div></div>
            <div class="form-section"><label>TRABAJO</label><div class="f-row"><input type="number" step="any" id="n-lat-2" placeholder="Lat"><input type="number" step="any" id="n-lng-2" placeholder="Lng"></div></div>
            <div class="form-section"><label>TEMP</label><div class="f-row"><input type="number" step="any" id="n-lat-temp" placeholder="Lat"><input type="number" step="any" id="n-lng-temp" placeholder="Lng"></div></div>
            <div style="display:flex; gap:10px;">
                <button id="btn-save" onclick="guardarCliente()" style="flex:2; background:var(--rp-red); color:white; border:none; padding:15px; border-radius:8px; font-weight:bold; cursor:pointer;">GUARDAR EN SUPABASE</button>
            </div>
        </div>
    </main>
</div>

<script src="rapidpack.shared.js"></script>
<script src="admin.js"></script>
</body>
</html>
