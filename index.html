<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruterik Pro - Control Inteligente</title>
    <link rel="icon" type="image/jpeg" href="logoCreator_imagetologo.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00c853; --accent: #2196f3; --dark: #2d3436; --gray: #f1f2f6; --edit: #ffc107; --danger: #ff5252; --success: #4caf50; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a1a1b; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('unnamed.jpg'); background-size: cover; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        #main-dashboard { display: none; background: url('unnamed.jpg') no-repeat center fixed; background-size: cover; height: 100vh; flex-direction: column; }
        
        .header { background: rgba(255,255,255,0.92); padding: 10px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary); }
        .container { display: grid; grid-template-columns: 410px 1fr; gap: 15px; padding: 15px; flex: 1; overflow: hidden; }
        .card { background: rgba(255,255,255,0.96); border-radius: 18px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); overflow-y: auto; }
        
        /* MAPA ESTILO WIDGET */
        #mapa-chofer { height: 250px; width: 100%; border-radius: 12px; margin-bottom: 15px; border: 2px solid var(--accent); display: none; }

        .item-ruta { background: white; padding: 12px; border-radius: 10px; margin-bottom: 8px; border-left: 6px solid var(--primary); display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 14px; }
        .item-ruta.llegando { background: #e8f5e9; border-left-color: var(--success); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .btn { border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 8px; }
        input { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        textarea { width: 100%; height: 100px; border-radius: 12px; padding: 12px; background: #fffde7; resize: none; font-size: 13px; }
        
        /* MODAL AGENDA */
        #modal-agenda { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10001; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 800px; height: 80vh; border-radius: 20px; padding: 25px; display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div style="background:white; padding:40px; border-radius:20px; text-align:center; width:300px;">
            <img src="logoCreator_imagetologo.jpg" width="80" style="border-radius:10px;">
            <h2>Ruterik Admin</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn" style="background:var(--primary); color:white;" onclick="login()">ENTRAR</button>
        </div>
    </div>

    <div id="modal-agenda">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>🗂️ Agenda Completa</h3>
                <button onclick="cerrarAgenda()">CERRAR</button>
            </div>
            <div id="lista-completa" style="overflow-y:auto; margin-top:15px;"></div>
        </div>
    </div>

    <div id="main-dashboard">
        <div class="header">
            <div style="display:flex; align-items:center; gap:12px;">
                <img src="logoCreator_imagetologo.jpg" height="40" style="border-radius:8px;">
                <span style="font-weight:900; font-size:22px;">RAPIDPACK <span style="color:var(--primary)">SDE</span></span>
            </div>
            <div style="display:flex; gap:10px;">
                <button onclick="toggleMapa()" style="background:#4285F4; color:white; border:none; padding:10px 15px; border-radius:10px; font-weight:bold; cursor:pointer;">🛰️ VER CHOFER</button>
                <button onclick="verAgenda()" style="background:var(--accent); color:white; border:none; padding:10px 15px; border-radius:10px; font-weight:bold; cursor:pointer;">🗂️ CLIENTES</button>
                <button onclick="logout()" style="background:var(--danger); color:white; border:none; padding:10px 15px; border-radius:10px; font-weight:bold; cursor:pointer;">SALIR</button>
            </div>
        </div>

        <div class="container">
            <div class="card">
                <div id="mapa-chofer"></div>
                
                <h3>🔍 Buscador</h3>
                <input type="text" id="bus" oninput="buscar()" placeholder="Nombre o ID...">
                <div id="res"></div>
                <hr>
                <h3 id="form-title">🆕 Registro</h3>
                <input type="hidden" id="edit-id">
                <input type="text" id="n-id" placeholder="ID / Código RP">
                <input type="text" id="n-nom" placeholder="Nombre completo">
                <div style="display:flex; gap:5px;"><input id="n-lat1" placeholder="Casa Lat"><input id="n-lng1" placeholder="Casa Lng"></div>
                <div style="display:flex; gap:5px;"><input id="n-lat2" placeholder="Trabajo Lat"><input id="n-lng2" placeholder="Trabajo Lng"></div>
                <button id="btn-save" class="btn" style="background:var(--primary); color:white;" onclick="guardar()">GUARDAR</button>
                <button id="btn-cancel" class="btn" style="display:none; background:#ccc;" onclick="cancelarEdicion()">CANCELAR</button>
            </div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 style="margin:0;">📍 Ruta de Hoy (<span id="count">0</span>)</h3>
                    <button class="btn" style="background:#ff9800; color:white; width:250px; margin:0;" onclick="optimizar()">⚡ OPTIMIZAR ORDEN</button>
                </div>
                <div id="lista" style="flex:1; overflow-y:auto; min-height:250px;"></div>
                <textarea id="repo" readonly></textarea>
                <button class="btn" style="background:var(--accent); color:white; margin-top:10px;" onclick="copiar()">COPIAR WHATSAPP</button>
            </div>
        </div>
    </div>

<script>
    const SB_URL = "https://trdfieobkewwjhzxwpxc.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk";
    const db = supabase.createClient(SB_URL, SB_KEY);
    const BASE = { lat: 18.48774, lng: -69.85612 };
    let ruta = [];
    let map, markerChofer;

    // --- INICIALIZAR MAPA ---
    function initMap() {
        if (map) return;
        map = L.map('mapa-chofer').setView([BASE.lat, BASE.lng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        markerChofer = L.marker([BASE.lat, BASE.lng]).addTo(map).bindPopup("Chofer RapidPack");
    }

    function toggleMapa() {
        const m = document.getElementById('mapa-chofer');
        const visible = m.style.display === 'block';
        m.style.display = visible ? 'none' : 'block';
        if (!visible) { initMap(); setTimeout(() => map.invalidateSize(), 100); }
    }

    // --- ESCUCHAR CHOFER REALTIME ---
    db.channel('gps').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rastreo_chofer' }, p => {
        const cLoc = { lat: p.new.lat, lng: p.new.lng };
        if (markerChofer) {
            markerChofer.setLatLng([cLoc.lat, cLoc.lng]);
            map.panTo([cLoc.lat, cLoc.lng]);
        }
        verificarLlegada(cLoc);
    }).subscribe();

    function verificarLlegada(cLoc) {
        ruta.forEach((c, i) => {
            const dist = Math.sqrt(Math.pow(c.lat - cLoc.lat, 2) + Math.pow(c.lng - cLoc.lng, 2));
            const el = document.getElementById(`item-${i}`);
            if (dist < 0.0007) { // ~70-80 metros
                el.classList.add('llegando');
                el.querySelector('.status').innerText = "✅ EN EL PUNTO";
            } else {
                el.classList.remove('llegando');
                el.querySelector('.status').innerText = "";
            }
        });
    }

    // --- LOGIN ---
    async function login() {
        const { error } = await db.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('pass').value });
        if (error) alert("Error");
    }
    async function logout() { await db.auth.signOut(); location.reload(); }
    db.auth.onAuthStateChange((ev, ses) => {
        document.getElementById('login-screen').style.display = ses ? 'none' : 'flex';
        document.getElementById('main-dashboard').style.display = ses ? 'flex' : 'none';
    });

    // --- BUSCADOR Y AGENDA ---
    async function buscar() {
        const t = document.getElementById('bus').value;
        if(t.length < 2) return;
        const { data } = await db.from('clientes').select('*').or(`nombre.ilike.%${t}%,codigo_rp.ilike.%${t}%`).limit(5);
        renderResultados(data, 'res');
    }

    function renderResultados(data, target) {
        const r = document.getElementById(target); r.innerHTML = "";
        data.forEach(c => {
            const hasC = (c.lat && c.lng); const hasT = (c.lat_2 && c.lng_2);
            r.innerHTML += `<div style="background:white; padding:10px; border-radius:10px; margin-bottom:5px; border:1px solid #ddd;"><button style="float:right; font-size:10px;" onclick='prepararEdicion(${JSON.stringify(c)})'>✏️</button><b>${c.nombre}</b><br><button class="btn-loc ${hasC ? 'has-data' : ''}" onclick='add(${JSON.stringify(c)}, "Casa")'>🏠 Casa</button><button class="btn-loc ${hasT ? 'has-data' : ''}" onclick='add(${JSON.stringify(c)}, "Trabajo")'>🏢 Trab</button></div>`;
        });
    }

    async function verAgenda() {
        document.getElementById('modal-agenda').style.display = 'flex';
        const { data } = await db.from('clientes').select('*').order('nombre', { ascending: true });
        renderResultados(data, 'lista-completa');
    }
    function cerrarAgenda() { document.getElementById('modal-agenda').style.display = 'none'; }

    // --- LOGICA RUTA ---
    function add(c, tipo) {
        const lat = (tipo === "Casa") ? c.lat : c.lat_2;
        const lng = (tipo === "Casa") ? c.lng : c.lng_2;
        ruta.push({ nombre: c.nombre, id: c.codigo_rp, lat, lng, tipo });
        actualizar();
    }

    function actualizar() {
        const l = document.getElementById('lista'); const repo = document.getElementById('repo');
        l.innerHTML = ""; document.getElementById('count').innerText = ruta.length;
        const hoy = new Date();
        const f = hoy.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
        const s = hoy.getHours() < 12 ? "Buenos días" : (hoy.getHours() < 18 ? "Buenas tardes" : "Buenas noches");
        let txt = `*${s}, esta es la ruta para hoy ${f}:* \n----------------------------\n`;
        ruta.forEach((c, i) => {
            l.innerHTML += `<div class="item-ruta" id="item-${i}"><span>${i+1}. ${c.nombre} <small>(${c.tipo})</small></span><span class="status" style="color:green; font-size:10px;"></span><button onclick="ruta.splice(${i},1); actualizar();" style="border:none; color:red; background:none;">X</button></div>`;
            txt += `${i+1}. ${c.nombre}\n`;
        });
        repo.value = ruta.length > 0 ? txt : "";
    }

    function optimizar() {
        if(ruta.length < 2) return;
        let opt = []; let cur = BASE; let copy = [...ruta];
        while(copy.length > 0) {
            let nIdx = 0; let minDist = Infinity;
            copy.forEach((c, i) => {
                let d = Math.sqrt(Math.pow(c.lat-cur.lat,2) + Math.pow(c.lng-cur.lng,2));
                if(d < minDist) { minDist = d; nIdx = i; }
            });
            cur = copy[nIdx]; opt.push(copy.splice(nIdx, 1)[0]);
        }
        ruta = opt; actualizar();
    }

    // --- CRUD ---
    function prepararEdicion(c) {
        cerrarAgenda(); document.getElementById('edit-id').value = c.id;
        document.getElementById('n-id').value = c.codigo_rp || ""; document.getElementById('n-nom').value = c.nombre;
        document.getElementById('n-lat1').value = c.lat || ""; document.getElementById('n-lng1').value = c.lng || "";
        document.getElementById('n-lat2').value = c.lat_2 || ""; document.getElementById('n-lng2').value = c.lng_2 || "";
        document.getElementById('form-title').innerText = "✏️ Editando Cliente";
        const btn = document.getElementById('btn-save'); btn.innerText = "ACTUALIZAR"; btn.style.background = "var(--accent)";
        document.getElementById('btn-cancel').style.display = "block";
    }

    function cancelarEdicion() {
        document.getElementById('edit-id').value = ""; document.getElementById('n-id').value = ""; document.getElementById('n-nom').value = "";
        document.getElementById('n-lat1').value = ""; document.getElementById('n-lng1').value = ""; document.getElementById('form-title').innerText = "🆕 Registro";
        const btn = document.getElementById('btn-save'); btn.innerText = "GUARDAR"; btn.style.background = "var(--primary)";
        document.getElementById('btn-cancel').style.display = "none";
    }

    async function guardar() {
        const id = document.getElementById('edit-id').value; const n = document.getElementById('n-nom').value;
        const d = { nombre: n, codigo_rp: document.getElementById('n-id').value || null, lat: parseFloat(document.getElementById('n-lat1').value) || null, lng: parseFloat(document.getElementById('n-lng1').value) || null, lat_2: parseFloat(document.getElementById('n-lat2').value) || null, lng_2: parseFloat(document.getElementById('n-lng2').value) || null };
        if(id) await db.from('clientes').update(d).eq('id', id); else await db.from('clientes').insert([d]);
        location.reload();
    }
    function copiar() { document.getElementById('repo').select(); document.execCommand('copy'); alert("Copiado"); }
</script>
</body>
</html>
