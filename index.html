<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RUTERIK - Centro de Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --rp-red: #ff3d00;
            --rp-green: #00c853;
            --bg-body: #0b0b0b;
            --bg-card: #1a1a1b;
            --bg-input: #111;
            --bg-header: #000;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border: #333333;
        }
        body.light-mode {
            --bg-body: #f4f4f9;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --bg-header: #ffffff;
            --text-main: #1a1a1b;
            --text-muted: #666666;
            --border: #dddddd;
        }
        body { margin: 0; background: var(--bg-body); color: var(--text-main); font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        #login-box { max-width: 400px; margin: 80px auto; background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        #login-box input { width: 100%; margin-bottom: 10px; padding: 12px; box-sizing: border-box; background: var(--bg-input); border: 1px solid var(--border); color: white; border-radius: 6px; }
        #login-box button { width: 100%; background: var(--rp-red); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        header { padding: 15px 30px; background: var(--bg-header); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--rp-red); }
        main { padding: 20px; max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 12px; padding: 20px; border: 1px solid var(--border); }
        .search-box { width: 100%; padding: 15px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px; font-size: 18px; box-sizing: border-box; }
        #cliente-seleccionado { display: none; margin-top: 15px; padding: 15px; background: var(--bg-input); border-radius: 10px; border: 1px dashed var(--border); }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-ubi { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 11px; }
        .btn-casa { background: #3498db; } .btn-trabajo { background: #9b59b6; } .btn-temp { background: #f39c12; }
        #reporte-texto { width: 100%; height: 100px; background: #000; color: var(--rp-green); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: monospace; margin-top: 10px; }
        .form-section { padding: 10px; background: var(--bg-body); border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--rp-red); }
        .f-row { display: flex; gap: 8px; margin-bottom: 8px; }
        label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        input[type="text"], input[type="number"] { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="login-box">
    <h2 style="color:var(--rp-red)">RUTERIK</h2>
    <input type="email" id="email" placeholder="Correo corporativo">
    <input type="password" id="password" placeholder="Contraseña">
    <button onclick="login()">ACCEDER AL SISTEMA</button>
</div>

<div id="admin-content" style="display:none;">
    <header>
        <h2 style="color: var(--rp-red); margin:0;">RUTERIK ADMIN</h2>
        <div>
            <button onclick="toggleTheme()" style="padding:8px 15px; cursor:pointer;">Cambiar Modo</button>
            <button onclick="location.href='despacho.html'" style="background:var(--rp-red); color:white; border:none; padding:8px 15px; border-radius:4px; font-weight:bold; cursor:pointer;">MONITOR</button>
        </div>
    </header>

    <main>
        <div class="card">
            <h3>Buscador</h3>
            <input type="text" id="buscador" class="search-box" placeholder="Nombre del cliente..." oninput="buscar()">
            <div id="cliente-seleccionado">
                <h2 id="view-nombre" style="margin:0; font-size:18px;"></h2>
                <div class="btn-group">
                    <button id="btn-casa" class="btn-ubi btn-casa" onclick="addParada('CASA')">CASA</button>
                    <button id="btn-trabajo" class="btn-ubi btn-trabajo" onclick="addParada('TRABAJO')">TRABAJO</button>
                    <button id="btn-temp" class="btn-ubi btn-temp" onclick="addParada('TEMPORAL')">TEMP</button>
                </div>
            </div>
            
            <div id="card-borrador" style="display:none; margin-top:20px;">
                <textarea id="reporte-texto" readonly></textarea>
                <div id="lista-borrador" style="margin: 10px 0;"></div>
                <button onclick="lanzarRuta()" style="width:100%; background:var(--rp-green); padding:15px; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">INICIAR DESPACHO</button>
            </div>
        </div>

        <div class="card">
            <h3>Nuevo Cliente / Editar</h3>
            <input type="hidden" id="edit-id">
            <div class="f-row">
                <div style="flex:2"><label>Nombre</label><input type="text" id="n-nombre"></div>
                <div style="flex:1"><label>Código RP</label><input type="text" id="n-codigo"></div>
            </div>
            <div class="form-section"><label>CASA</label><div class="f-row"><input type="number" step="any" id="n-lat" placeholder="Lat"><input type="number" step="any" id="n-lng" placeholder="Lng"></div></div>
            <div class="form-section"><label>TRABAJO</label><div class="f-row"><input type="number" step="any" id="n-lat-2" placeholder="Lat"><input type="number" step="any" id="n-lng-2" placeholder="Lng"></div></div>
            <div class="form-section"><label>TEMPORAL</label><div class="f-row"><input type="number" step="any" id="n-lat-temp" placeholder="Lat"><input type="number" step="any" id="n-lng-temp" placeholder="Lng"></div></div>
            <button onclick="guardarCliente()" style="width:100%; background:var(--rp-red); color:white; border:none; padding:15px; border-radius:8px; font-weight:bold; cursor:pointer;">GUARDAR DATOS</button>
        </div>
    </main>
</div>

<script src="rapidpack.shared.js"></script>
<script src="admin.js"></script>
</body>
</html>
