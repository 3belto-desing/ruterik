<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruterik Pro - RapidPack</title>
    <link rel="icon" type="image/jpeg" href="logoCreator_imagetologo.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00c853; --accent: #2196f3; --dark: #2d3436; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a1a1b; height: 100vh; display: flex; flex-direction: column; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('unnamed.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .login-card { background: white; padding: 40px; border-radius: 20px; width: 350px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        #main-dashboard { display: none; background: url('unnamed.jpg') no-repeat center center fixed; background-size: cover; height: 100vh; flex-direction: column; }
        .header { background: rgba(255,255,255,0.9); padding: 10px 25px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(5px); border-bottom: 3px solid var(--primary); }
        .container { display: grid; grid-template-columns: 400px 1fr; gap: 15px; padding: 15px; flex: 1; overflow: hidden; }
        .card { background: rgba(255,255,255,0.96); border-radius: 15px; padding: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); overflow-y: auto; }
        h3 { margin: 0 0 10px 0; font-size: 16px; color: var(--dark); border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
        input { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .btn { border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-add { background: var(--primary); color: white; margin-bottom: 10px; }
        .btn-opt { background: #ff9800; color: white; font-size: 16px; }
        .item-res { background: white; border: 1px solid #ddd; padding: 10px; border-radius: 10px; margin-bottom: 8px; }
        .btn-loc { padding: 6px 10px; font-size: 11px; margin-right: 5px; background: #f1f2f6; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; }
        .item-ruta { background: #fff; padding: 12px; border-radius: 10px; margin-bottom: 8px; border-left: 6px solid var(--primary); display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 14px; }
        textarea { width: 100%; height: 130px; border-radius: 10px; border: 1px solid #ddd; padding: 12px; font-family: 'Segoe UI', sans-serif; resize: none; background: #fffde7; font-size: 14px; color: #2d3436; font-weight: 500; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="logoCreator_imagetologo.jpg" width="100" style="border-radius: 15px; margin-bottom: 15px;">
            <h2 style="margin:0 0 20px 0; color:var(--dark);">Ruterik Access</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Contraseña">
            <button class="btn btn-add" onclick="login()">ENTRAR</button>
            <p id="error" style="color:red; font-size:13px; font-weight:bold;"></p>
        </div>
    </div>

    <div id="main-dashboard">
        <div class="header">
            <div style="display:flex; align-items:center; gap:12px;">
                <img src="logoCreator_imagetologo.jpg" height="45" style="border-radius:8px;">
                <span style="font-weight:900; font-size:22px;">RAPIDPACK <span style="color:var(--primary)">SDE</span></span>
            </div>
            <button onclick="logout()" style="background:#ff5252; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-weight:bold;">Salir</button>
        </div>

        <div class="container">
            <div class="card">
                <h3>🔍 Agenda</h3>
                <input type="text" id="bus" oninput="buscar()" placeholder="Buscar cliente...">
                <div id="res"></div>
                <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
                <h3>🆕 Registro</h3>
                <input type="text" id="n-id" placeholder="ID / Código RP">
                <input type="text" id="n-nom" placeholder="Nombre completo">
                <div style="display:flex; gap:10px;"><input id="n-lat1" placeholder="Casa Lat"><input id="n-lng1" placeholder="Casa Lng"></div>
                <div style="display:flex; gap:10px;"><input id="n-lat2" placeholder="Trabajo Lat"><input id="n-lng2" placeholder="Trabajo Lng"></div>
                <button class="btn btn-add" onclick="guardar()">GUARDAR</button>
            </div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h3 style="margin:0; border:0;">📍 Ruta actual (<span id="count">0</span>)</h3>
                    <button class="btn btn-opt" style="width:250px;" onclick="optimizar()">⚡ OPTIMIZAR</button>
                </div>
                <div id="lista" style="flex:1; overflow-y:auto; min-height:250px;"></div>
                <div style="margin-top:20px; background:#fff; padding:15px; border-radius:12px; border:1px solid #ddd;">
                    <h3 style="border:0">📋 Mensaje para WhatsApp</h3>
                    <textarea id="repo" readonly></textarea>
                    <button class="btn" style="background:var(--accent); color:white; margin-top:10px;" onclick="copiar()">COPIAR LISTA</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const SB_URL = "https://trdfieobkewwjhzxwpxc.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk";
    const db = supabase.createClient(SB_URL, SB_KEY);
    const BASE = { lat: 18.48774, lng: -69.85612 };
    let ruta = [];

    async function login() {
        const { error } = await db.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('pass').value });
        if (error) document.getElementById('error').innerText = "Acceso denegado";
    }

    async function logout() { await db.auth.signOut(); location.reload(); }

    db.auth.onAuthStateChange((event, session) => {
        document.getElementById('login-screen').style.display = session ? 'none' : 'flex';
        document.getElementById('main-dashboard').style.display = session ? 'flex' : 'none';
    });

    async function buscar() {
        const t = document.getElementById('bus').value;
        if(t.length < 2) return;
        const { data } = await db.from('clientes').select('*').or(`nombre.ilike.%${t}%,codigo_rp.ilike.%${t}%`).limit(5);
        const r = document.getElementById('res'); r.innerHTML = "";
        data.forEach(c => {
            let btns = "";
            if(c.lat && c.lng) btns += `<button class="btn-loc" onclick='add(${JSON.stringify(c)}, "Casa")'>🏠 Casa</button>`;
            if(c.lat_2 && c.lng_2) btns += `<button class="btn-loc" onclick='add(${JSON.stringify(c)}, "Trabajo")'>🏢 Trabajo</button>`;
            btns += `<button class="btn-loc" onclick='addTemp(${JSON.stringify(c)})'>📍 Temp</button>`;
            r.innerHTML += `<div class="item-res"><b>[${c.codigo_rp || 'S/ID'}] ${c.nombre}</b><div style="margin-top:8px;">${btns}</div></div>`;
        });
    }

    function add(c, tipo) {
        const lat = (tipo === "Casa") ? c.lat : c.lat_2;
        const lng = (tipo === "Casa") ? c.lng : c.lng_2;
        ruta.push({ nombre: c.nombre, id: c.codigo_rp, lat, lng, tipo });
        actualizar();
    }

    function addTemp(c) {
        const lt = prompt("Latitud:"); const lg = prompt("Longitud:");
        if(lt && lg) { ruta.push({ nombre: c.nombre, id: c.codigo_rp, lat: parseFloat(lt), lng: parseFloat(lg), tipo: "Temp" }); actualizar(); }
    }

    function actualizar() {
        const l = document.getElementById('lista'); const repo = document.getElementById('repo');
        l.innerHTML = ""; document.getElementById('count').innerText = ruta.length;
        
        // --- LOGICA DE FECHA Y SALUDO ---
        const hoy = new Date();
        const hora = hoy.getHours();
        const opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long' };
        const fechaTexto = hoy.toLocaleDateString('es-ES', opcionesFecha);
        
        let saludo = hora < 12 ? "Buenos días" : (hora < 18 ? "Buenas tardes" : "Buenas noches");
        
        let txt = `*${saludo}, esta es la ruta para hoy ${fechaTexto}:* \n----------------------------\n`;
        
        ruta.forEach((c, i) => {
            l.innerHTML += `<div class="item-ruta"><span>${i+1}. ${c.nombre} <small style="color:#888">(${c.tipo})</small></span><button onclick="ruta.splice(${i},1); actualizar();" style="border:none; color:red; cursor:pointer; background:none;">X</button></div>`;
            txt += `${i+1}. ${c.nombre}\n`;
        });
        repo.value = ruta.length > 0 ? txt : "";
    }

    function optimizar() {
        if(ruta.length < 2) return;
        let opt = []; let cur = BASE; let copy = [...ruta];
        while(copy.length > 0) {
            let nIdx = 0; let minDist = Infinity;
            copy.forEach((c, i) => {
                let d = Math.sqrt(Math.pow(c.lat-cur.lat,2) + Math.pow(c.lng-cur.lng,2));
                if(d < minDist) { minDist = d; nIdx = i; }
            });
            cur = copy[nIdx]; opt.push(copy.splice(nIdx, 1)[0]);
        }
        ruta = opt; actualizar();
    }

    async function guardar() {
        const n = document.getElementById('n-nom').value;
        const id = document.getElementById('n-id').value;
        const l1 = document.getElementById('n-lat1').value;
        const g1 = document.getElementById('n-lng1').value;
        const l2 = document.getElementById('n-lat2').value;
        const g2 = document.getElementById('n-lng2').value;
        if(!n) return alert("El nombre es obligatorio");
        const d = { nombre: n, codigo_rp: id || null, lat: l1 ? parseFloat(l1) : null, lng: g1 ? parseFloat(g1) : null, lat_2: l2 ? parseFloat(l2) : null, lng_2: g2 ? parseFloat(g2) : null };
        const { error } = await db.from('clientes').insert([d]);
        if(error) alert("Error al guardar"); else { alert("Guardado con éxito"); location.reload(); }
    }

    function copiar() { document.getElementById('repo').select(); document.execCommand('copy'); alert("¡Lista copiada!"); }
</script>
</body>
</html>
