<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruterik Pro - Control Autónomo</title>
    <link rel="icon" type="image/jpeg" href="logoCreator_imagetologo.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00c853; --bg: #f4f7f6; --card: #ffffff; --text: #333; --border: #ddd; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; }
        #app-container { background: var(--card); padding: 25px; width: 95%; max-width: 1200px; margin: 20px; border-radius: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.1); display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .brand { font-size: 28px; font-weight: 900; color: var(--primary); letter-spacing: -1.5px; }
        .progress-wrapper { background: #eee; border-radius: 10px; height: 22px; width: 100%; margin-bottom: 15px; overflow: hidden; position: relative; }
        #progress-bar { background: var(--primary); height: 100%; width: 0%; transition: 0.6s ease; }
        #progress-text { position: absolute; width: 100%; text-align: center; font-size: 11px; font-weight: 800; line-height: 22px; }
        #map { height: 400px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 20px; }
        .item-cl { background: white; padding: 12px; border: 1px solid var(--border); margin-bottom: 8px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .item-cl.entregado { border-left: 10px solid var(--primary); background: #f0fdf4; }
        .btn-view { background: #2196f3; color: white; text-decoration: none; padding: 10px 15px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        textarea { width: 100%; margin-top: 10px; padding: 15px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; resize: none; }
    </style>
</head>
<body class="login-state" style="justify-content: center; height: 100vh;">

    <div id="auth-container" style="background: white; padding: 40px; border-radius: 30px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2);">
        <img src="logoCreator_imagetologo.jpg" style="width:100px; border-radius:20px; margin-bottom:15px;">
        <div class="brand">RUTERIK</div>
        <input type="email" id="email" placeholder="Correo" style="width:100%; padding:10px; margin-top:10px; border-radius:8px; border:1px solid #ddd;">
        <input type="password" id="password" placeholder="Contraseña" style="width:100%; padding:10px; margin-top:10px; border-radius:8px; border:1px solid #ddd;">
        <button onclick="login()" style="width:100%; background:var(--primary); color:white; border:none; padding:15px; border-radius:12px; font-weight:bold; cursor:pointer; margin-top:15px;">ENTRAR</button>
    </div>

    <div id="app-container">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="logoCreator_imagetologo.jpg" style="height:40px; border-radius:8px;">
                <div class="brand">RUTERIK PRO</div>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <a href="chofer.html" target="_blank" class="btn-view">📱 MAPA DEL CHOFER</a>
                <div id="chofer-status" style="font-weight:bold; font-size:12px; color:red;">● GPS OFF</div>
            </div>
        </div>

        <div class="progress-wrapper">
            <div id="progress-bar"></div>
            <div id="progress-text">ESPERANDO DESPACHO</div>
        </div>

        <div id="map"></div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
            <div style="background:#f9f9f9; padding:15px; border-radius:15px;">
                <h4>📍 Ruta del Día</h4>
                <button onclick="optimizar()" style="width:100%; background:#ffd600; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer; margin-bottom:15px;">⚡ OPTIMIZAR ORDEN</button>
                <div id="lista-ruta"></div>
            </div>
            <div style="background:#f9f9f9; padding:15px; border-radius:15px;">
                <h4>📋 Reporte para WhatsApp (Texto Limpio)</h4>
                <textarea id="output" rows="8" readonly></textarea>
                <button onclick="copiar()" style="width:100%; background:#25d366; color:white; border:none; padding:15px; border-radius:10px; font-weight:bold; margin-top:10px; cursor:pointer;">COPIAR REPORTE</button>
            </div>
        </div>
        
        <div class="panel" style="margin-top:20px; background:#eee; padding:20px; border-radius:15px;">
            <h4>🗂 Agregar Clientes</h4>
            <input type="text" oninput="buscar()" id="buscador" placeholder="Escriba nombre del cliente..." style="width:100%; padding:12px; border-radius:10px; border:1px solid #ccc;">
            <div id="res-busqueda" style="margin-top:15px;"></div>
        </div>
    </div>

<script>
    const SB_URL = "https://trdfieobkewwjhzxwpxc.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk";
    const db = supabase.createClient(SB_URL, SB_KEY);
    const SUCURSAL = [18.48774, -69.85612];
    
    let map, markersLayer, choferMarker, ruta = [];

    // AUTENTICACION
    db.auth.onAuthStateChange((e, s) => {
        if (s) {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            document.body.style.justifyContent = 'flex-start';
            iniciarMapa();
        }
    });

    async function login() {
        const { error } = await db.auth.signInWithPassword({ 
            email: document.getElementById('email').value, 
            password: document.getElementById('password').value 
        });
        if (error) alert("Datos incorrectos");
    }

    function iniciarMapa() {
        if (map) return;
        map = L.map('map').setView(SUCURSAL, 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        markersLayer = L.layerGroup().addTo(map);
        choferMarker = L.marker(SUCURSAL, { 
            icon: L.divIcon({ html: '🚚', className: 't-icon', iconSize:[30,30] }) 
        }).addTo(map).bindPopup("Chofer");
        escucharChofer();
    }

    function calcularDistancia(la1, lo1, la2, lo2) {
        const R = 6371e3;
        const dL = (la2-la1)*Math.PI/180, dO = (lo2-lo1)*Math.PI/180;
        const a = Math.sin(dL/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function escucharChofer() {
        db.channel('rastreo').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rastreo_chofer' }, p => {
            const lat = p.new.lat, lng = p.new.lng;
            choferMarker.setLatLng([lat, lng]);
            document.getElementById('chofer-status').style.color = '#00c853';
            document.getElementById('chofer-status').innerText = '● GPS ONLINE';

            // AUTO-MARCADO DE LLEGADA
            ruta.forEach((cl, i) => {
                if (!cl.entregado) {
                    if (calcularDistancia(lat, lng, cl.aLat, cl.aLng) < 50) {
                        ruta[i].entregado = true;
                        actualizarUI();
                    }
                }
            });
        }).subscribe();
    }

    async function buscar() {
        const txt = document.getElementById('buscador').value;
        if (txt.length < 2) return;
        const { data } = await db.from('clientes').select('*').ilike('nombre', `%${txt}%`).limit(5);
        const res = document.getElementById('res-busqueda'); res.innerHTML = "";
        data.forEach(cl => {
            res.innerHTML += `<div class="item-cl">
                <span><b>${cl.nombre}</b></span>
                <div>
                    <button style="background:var(--primary); color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;" onclick='agregar(${JSON.stringify(cl)}, 1)'>🏠</button>
                    <button style="background:#9c27b0; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;" onclick='agregar(${JSON.stringify(cl)}, 2)'>🏢</button>
                </div>
            </div>`;
        });
    }

    function agregar(cl, tipo) {
        const lt = (tipo === 1) ? cl.lat : cl.lat_2, lg = (tipo === 1) ? cl.lng : cl.lng_2;
        if (!lt) return alert("Sin coordenadas");
        ruta.push({ ...cl, aLat: lt, aLng: lg, label: (tipo === 1 ? '🏠' : '🏢'), entregado: false });
        actualizarUI();
    }

    function actualizarUI() {
        const list = document.getElementById('lista-ruta');
        list.innerHTML = ""; markersLayer.clearLayers();
        let ents = 0, txt = "*RUTA RAPIDPACK*\n\n";

        ruta.forEach((cl, i) => {
            if (cl.entregado) ents++;
            list.innerHTML += `<div class="item-cl ${cl.entregado ? 'entregado' : 'pendiente'}">
                <span>${i+1}. ${cl.label} ${cl.nombre} ${cl.entregado ? '✅' : '⏳'}</span>
                <button onclick="ruta.splice(${i},1); actualizarUI();" style="border:none; background:none; color:red; cursor:pointer;">×</button>
            </div>`;
            L.circleMarker([cl.aLat, cl.aLng], { color: cl.entregado ? 'green' : 'red', radius: 8 }).addTo(markersLayer);
            txt += `${i+1}. ${cl.label} ${cl.nombre} ${cl.entregado ? '[OK]' : ''}\n`;
        });

        const porc = ruta.length > 0 ? Math.round((ents / ruta.length) * 100) : 0;
        document.getElementById('progress-bar').style.width = porc + "%";
        document.getElementById('progress-text').innerText = `PROGRESO: ${porc}%`;
        document.getElementById('output').value = ruta.length > 0 ? txt : "";
    }

    function optimizar() {
        ruta.sort((a,b) => calcularDistancia(a.aLat, a.aLng, SUCURSAL[0], SUCURSAL[1]) - calcularDistancia(b.aLat, b.aLng, SUCURSAL[0], SUCURSAL[1]));
        actualizarUI();
    }

    function copiar() {
        const o = document.getElementById('output'); o.select(); document.execCommand('copy'); alert("Reporte copiado.");
    }
</script>
</body>
</html>
