<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidPack Control Pro 🛰️</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; display: flex; }
        
        #sidebar { 
            width: 300px; height: 100%; background: #111; color: white; 
            border-right: 2px solid #333; display: flex; flex-direction: column; z-index: 2000;
        }
        .header { padding: 20px; background: #000; border-bottom: 3px solid #ff3d00; }
        .route-list { flex: 1; overflow-y: auto; padding: 15px; }

        #map-container { flex: 1; position: relative; height: 100%; background: #222; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }

        .client-card { 
            background: #222; margin-bottom: 12px; padding: 15px; border-radius: 10px;
            border-left: 5px solid #555; display: flex; justify-content: space-between; align-items: center;
        }
        .completed { border-left-color: #00c853 !important; opacity: 0.6; }
        .check { width: 20px; height: 20px; border: 2px solid #555; border-radius: 50%; }
        .completed .check { background: #00c853; border-color: #00c853; }
        .dist { font-size: 11px; color: #ff9800; display: block; margin-top: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h2 style="margin:0; color:#ff3d00;">RAPIDPACK</h2>
            <div id="status" style="font-size: 12px; color: #00c853; margin-top:5px;">● RADAR ACTIVO</div>
        </div>
        <div class="route-list" id="lista"></div>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

<script>
    const db = supabase.createClient("https://trdfieobkewwjhzxwpxc.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk");

    var map = L.map('map', { zoomControl: false }).setView([18.4877, -69.8561], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    var iconoCamion = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/1048/1048329.png', iconSize: [40, 40] });
    var markerChofer = L.marker([0, 0], { icon: iconoCamion }).addTo(map);

    let clientes = [];

    async function cargarDatos() {
        const { data } = await db.from('ruta_activa').select('*').order('orden', { ascending: true });
        clientes = data || [];
        
        const listaDiv = document.getElementById('lista');
        listaDiv.innerHTML = '';
        
        clientes.forEach(c => {
            const isDone = c.estado === 'Entregado';
            listaDiv.innerHTML += `
                <div class="client-card ${isDone ? 'completed' : ''}">
                    <div>
                        <b style="font-size:14px;">${c.orden}. ${c.nombre}</b>
                        <span class="dist" id="d-${c.id}">${isDone ? 'Entregado' : 'Calculando...'}</span>
                    </div>
                    <div class="check"></div>
                </div>
            `;
            L.circleMarker([c.lat, c.lng], { color: isDone ? '#00c853' : '#ff9800', radius: 6 }).addTo(map);
        });
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371000; 
        const dLat = (lat2-lat1) * Math.PI/180;
        const dLon = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function actualizarGps(lat, lng) {
        markerChofer.setLatLng([lat, lng]);
        map.panTo([lat, lng]);

        for (let c of clientes) {
            if (c.estado !== 'Entregado') {
                const metros = calcularDistancia(lat, lng, c.lat, c.lng);
                const el = document.getElementById(`d-${c.id}`);
                
                if (el) {
                    // LÓGICA DE UNIDADES: km o metros
                    if (metros >= 1000) {
                        const km = metros / 1000;
                        el.innerText = `A ${km.toFixed(1)} km`; // Ejemplo: A 14.5 km
                    } else {
                        el.innerText = `A ${metros.toFixed(0)} metros`; // Ejemplo: A 450 metros
                    }
                }

                if (metros <= 15) {
                    await db.from('ruta_activa').update({ estado: 'Entregado' }).eq('id', c.id);
                }
            }
        }
    }

    db.channel('flota')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rastreo_chofer' }, p => actualizarGps(p.new.lat, p.new.lng))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ruta_activa' }, () => cargarDatos())
    .subscribe();

    cargarDatos();
</script>
</body>
</html>
