<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidPack Live Radar 🛰️</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        .panel { 
            position: absolute; top: 20px; left: 20px; z-index: 1000; 
            background: rgba(0,0,0,0.85); color: white; padding: 20px; 
            border-radius: 12px; border-left: 5px solid #ff3d00; width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; background: #444; margin-top: 10px; }
        .online { background: #00c853; color: black; }
    </style>
</head>
<body>

    <div class="panel">
        <h2 style="margin:0; color:#ff3d00;">RAPIDPACK SDE</h2>
        <p style="margin:5px 0; font-size:13px; color:#ccc;">Monitor de Flota en Vivo</p>
        <div id="status-tag" class="tag">🛰️ BUSCANDO SEÑAL...</div>
    </div>

    <div id="map"></div>

<script>
    // 1. Conexión a la Base de Datos
    const SB_URL = "https://trdfieobkewwjhzxwpxc.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk";
    const db = supabase.createClient(SB_URL, SB_KEY); // Usaremos 'db' para todo

    // 2. Crear el Mapa (Centrado en SDE)
    var map = L.map('map', { zoomControl: false }).setView([18.4877, -69.8561], 15);

    // Poner el diseño del mapa (Oscuro Pro)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    // 3. Crear el Camioncito Rojo
    var iconoRojo = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/1048/1048329.png',
        iconSize: [45, 45],
        iconAnchor: [22, 22]
    });

    var camion = L.marker([18.4877, -69.8561], { icon: iconoRojo }).addTo(map);

    // 4. Función para mover el camión
    function mover(lat, lng) {
        if (!lat || !lng) return;
        camion.setLatLng([lat, lng]);
        map.panTo([lat, lng]); // La cámara sigue al chofer
        
        document.getElementById('status-tag').innerText = "🟢 CHOFER EN VIVO";
        document.getElementById('status-tag').classList.add('online');
    }

    // 5. Iniciar Rastreo
    async function iniciar() {
        // Cargar última posición
        const { data } = await db.from('rastreo_chofer').select('*').eq('id', 'chofer1').single();
        if (data) mover(data.lat, data.lng);

        // Escuchar cambios en tiempo real
        db.channel('gps')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rastreo_chofer' }, (payload) => {
                mover(payload.new.lat, payload.new.lng);
            })
            .subscribe();
    }

    iniciar();
</script>
</body>
</html>
