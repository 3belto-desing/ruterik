<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RapidPack Admin - Centro de Despacho 🚚</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --rp-red: #ff3d00; --rp-black: #0b0b0b; --rp-grey: #1a1a1b; --rp-green: #00c853; }
        body { margin: 0; background: var(--rp-black); color: white; font-family: 'Segoe UI', sans-serif; }
        header { padding: 15px 30px; background: #000; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--rp-red); }
        main { padding: 20px; max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
        .card { background: var(--rp-grey); border-radius: 12px; padding: 20px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; }

        /* BUSCADOR */
        .search-box { width: 100%; padding: 15px; background: #222; border: 2px solid #444; color: white; border-radius: 8px; font-size: 18px; box-sizing: border-box; }
        #cliente-seleccionado { display: none; margin-top: 15px; padding: 15px; background: #222; border-radius: 10px; border: 1px dashed #444; position: relative; }
        
        /* BOTÓN EDITAR (LÁPIZ) */
        .btn-edit { position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 18px; cursor: pointer; color: #f39c12; transition: 0.3s; }
        .btn-edit:hover { transform: scale(1.2); color: var(--rp-red); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-ubi { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 10px; text-transform: uppercase; }
        .btn-casa { background: #3498db; } .btn-trabajo { background: #9b59b6; } .btn-temp { background: #f39c12; }
        .btn-ubi:disabled { background: #444; opacity: 0.2; }

        #reporte-texto { width: 100%; height: 100px; background: #000; color: var(--rp-green); border: 1px solid #444; border-radius: 8px; padding: 10px; font-family: monospace; resize: none; margin-top: 10px; }
        .item-draft { background: #252526; padding: 10px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--rp-red); }

        /* FORMULARIO */
        label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; font-weight: bold; }
        .f-row { display: flex; gap: 8px; margin-bottom: 8px; }
        input { background: #111; border: 1px solid #333; color: white; padding: 10px; border-radius: 6px; flex: 1; font-size: 13px; }
        .form-section { padding: 10px; background: #222; border-radius: 8px; border-left: 3px solid #444; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <h2 style="color: var(--rp-red); margin:0;">RAPIDPACK ADMIN</h2>
    <button style="background:var(--rp-grey); color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer;" onclick="location.href='despacho.html'">🖥️ MONITOR</button>
</header>

<main>
    <div class="card">
        <h3>🔍 Buscar Cliente</h3>
        <input type="text" id="buscador" class="search-box" placeholder="Escribe nombre..." oninput="buscar()">
        
        <div id="cliente-seleccionado">
            <button class="btn-edit" title="Editar Cliente" onclick="cargarEdicion()">✏️</button>
            
            <h2 id="view-nombre" style="margin:0; font-size:18px; color:white; padding-right: 30px;"></h2>
            <div class="btn-group">
                <button id="btn-casa" class="btn-ubi btn-casa" onclick="addParada('CASA')">🏠 CASA</button>
                <button id="btn-trabajo" class="btn-ubi btn-trabajo" onclick="addParada('TRABAJO')">💼 TRABAJO</button>
                <button id="btn-temp" class="btn-ubi btn-temp" onclick="addParada('TEMPORAL')">⏳ TEMP</button>
            </div>
        </div>

        <div id="card-borrador" style="display:none; margin-top:20px; border-top:1px solid #333; padding-top:20px;">
            <h3>📄 Texto para copiar</h3>
            <textarea id="reporte-texto" readonly></textarea>
            <div id="lista-borrador" style="margin-top:15px; max-height: 200px; overflow-y: auto;"></div>
            <button style="width:100%; background:var(--rp-green); border:none; padding:15px; font-weight:bold; border-radius:8px; cursor:pointer; margin-top:10px;" onclick="lanzarRuta()">🚀 LANZAR RUTA</button>
        </div>
    </div>

    <div class="card">
        <h3 id="form-titulo" style="color:#aaa;">➕ Registrar Nuevo Cliente</h3>
        <input type="hidden" id="edit-id"> <div class="f-row">
            <div style="flex:2"><label>Nombre del Cliente</label><input type="text" id="n-nombre"></div>
            <div style="flex:1"><label>Código RP</label><input type="text" id="n-codigo"></div>
        </div>

        <div class="form-section" style="border-left-color: #3498db;">
            <label>🏠 1. CASA (lat / lng)</label>
            <div class="f-row">
                <input type="number" step="any" id="n-lat" placeholder="Latitud">
                <input type="number" step="any" id="n-lng" placeholder="Longitud">
            </div>
        </div>

        <div class="form-section" style="border-left-color: #9b59b6;">
            <label>💼 2. TRABAJO (lat_2 / lng_2)</label>
            <div class="f-row">
                <input type="number" step="any" id="n-lat-2" placeholder="Latitud">
                <input type="number" step="any" id="n-lng-2" placeholder="Longitud">
            </div>
        </div>

        <div class="form-section" style="border-left-color: #f39c12;">
            <label>⏳ 3. TEMPORAL (lat_temp / lng_temp)</label>
            <div class="f-row">
                <input type="number" step="any" id="n-lat-temp" placeholder="Latitud">
                <input type="number" step="any" id="n-lng-temp" placeholder="Longitud">
            </div>
        </div>

        <div style="display:flex; gap:10px;">
            <button id="btn-save" onclick="guardarCliente()" style="flex:2; background:var(--rp-red); color:white; border:none; padding:15px; border-radius:8px; font-weight:bold; cursor:pointer;">💾 GUARDAR CLIENTE</button>
            <button id="btn-cancel" onclick="cancelarEdicion()" style="flex:1; background:#444; color:white; border:none; padding:15px; border-radius:8px; cursor:pointer; display:none;">CANCELAR</button>
        </div>
    </div>
</main>

<script>
    const db = supabase.createClient("https://trdfieobkewwjhzxwpxc.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk");
    let clientesRaw = []; let borrador = []; let clienteActivo = null;

    async function init() { 
        const { data } = await db.from('clientes').select('*'); 
        clientesRaw = data || []; 
    }

    function getSaludo() { const h = new Date().getHours(); return h < 12 ? "Buenos días" : h < 18 ? "Buenas tardes" : "Buenas noches"; }

    function buscar() {
        const txt = document.getElementById('buscador').value.toLowerCase();
        const display = document.getElementById('cliente-seleccionado');
        if (txt.length < 2) { display.style.display = 'none'; return; }
        
        clienteActivo = clientesRaw.find(c => c.nombre && c.nombre.toLowerCase().includes(txt));
        if (clienteActivo) {
            display.style.display = 'block'; 
            document.getElementById('view-nombre').innerText = clienteActivo.nombre;
            document.getElementById('btn-casa').disabled = !clienteActivo.lat;
            document.getElementById('btn-trabajo').disabled = !clienteActivo.lat_2;
            document.getElementById('btn-temp').disabled = !clienteActivo.lat_temp;
        } else { display.style.display = 'none'; }
    }

    // --- FUNCIÓN PARA CARGAR LOS DATOS EN EL FORMULARIO ---
    function cargarEdicion() {
        if (!clienteActivo) return;
        document.getElementById('form-titulo').innerText = "✏️ Editando: " + clienteActivo.nombre;
        document.getElementById('form-titulo').style.color = "#f39c12";
        
        // Llenar campos
        document.getElementById('edit-id').value = clienteActivo.id;
        document.getElementById('n-nombre').value = clienteActivo.nombre || '';
        document.getElementById('n-codigo').value = clienteActivo.codigo_rp || '';
        document.getElementById('n-lat').value = clienteActivo.lat || '';
        document.getElementById('n-lng').value = clienteActivo.lng || '';
        document.getElementById('n-lat-2').value = clienteActivo.lat_2 || '';
        document.getElementById('n-lng-2').value = clienteActivo.lng_2 || '';
        document.getElementById('n-lat-temp').value = clienteActivo.lat_temp || '';
        document.getElementById('n-lng-temp').value = clienteActivo.lng_temp || '';

        document.getElementById('btn-save').innerText = "🔄 ACTUALIZAR DATOS";
        document.getElementById('btn-save').style.background = "#f39c12";
        document.getElementById('btn-cancel').style.display = "block";
    }

    function cancelarEdicion() {
        document.getElementById('edit-id').value = "";
        document.getElementById('n-nombre').value = "";
        document.getElementById('n-codigo').value = "";
        document.getElementById('n-lat').value = ""; document.getElementById('n-lng').value = "";
        document.getElementById('n-lat-2').value = ""; document.getElementById('n-lng-2').value = "";
        document.getElementById('n-lat-temp').value = ""; document.getElementById('n-lng-temp').value = "";
        
        document.getElementById('form-titulo').innerText = "➕ Registrar Nuevo Cliente";
        document.getElementById('form-titulo').style.color = "#aaa";
        document.getElementById('btn-save').innerText = "💾 GUARDAR CLIENTE";
        document.getElementById('btn-save').style.background = "var(--rp-red)";
        document.getElementById('btn-cancel').style.display = "none";
    }

    async function guardarCliente() {
        const idEdit = document.getElementById('edit-id').value;
        const nombre = document.getElementById('n-nombre').value;
        if (!nombre) return alert("Nombre obligatorio");

        const datos = { 
            nombre, 
            codigo_rp: document.getElementById('n-codigo').value, 
            lat: document.getElementById('n-lat').value || null, lng: document.getElementById('n-lng').value || null, 
            lat_2: document.getElementById('n-lat-2').value || null, lng_2: document.getElementById('n-lng-2').value || null, 
            lat_temp: document.getElementById('n-lat-temp').value || null, lng_temp: document.getElementById('n-lng-temp').value || null 
        };

        if (idEdit) {
            // ACTUALIZAR EXISTENTE
            const { error } = await db.from('clientes').update(datos).eq('id', idEdit);
            if (error) alert("Error: " + error.message);
            else alert("¡Datos actualizados!");
        } else {
            // INSERTAR NUEVO
            const { error } = await db.from('clientes').insert([datos]);
            if (error) alert("Error: " + error.message);
            else alert("¡Cliente guardado!");
        }
        location.reload();
    }

    function addParada(tipo) {
        let lat, lng;
        if (tipo === 'CASA') { lat = clienteActivo.lat; lng = clienteActivo.lng; }
        else if (tipo === 'TRABAJO') { lat = clienteActivo.lat_2; lng = clienteActivo.lng_2; }
        else { lat = clienteActivo.lat_temp; lng = clienteActivo.lng_temp; }
        borrador.push({ nombre: clienteActivo.nombre, ubi: tipo, lat, lng });
        actualizarBorradorUI();
    }

    function actualizarBorradorUI() {
        document.getElementById('card-borrador').style.display = borrador.length > 0 ? 'block' : 'none';
        document.getElementById('lista-borrador').innerHTML = borrador.map((item, i) => `<div class="item-draft"><span><b>${i+1}.</b> ${item.nombre}</span><button style="background:none; border:none; color:#ff5555;" onclick="borrador.splice(${i},1); actualizarBorradorUI()">✕</button></div>`).join('');
        let texto = `${getSaludo()} equipo, ruta para hoy:\n\n`;
        borrador.forEach((p, i) => { texto += `${i + 1}. ${p.nombre}\n`; });
        document.getElementById('reporte-texto').value = texto;
    }

    async function lanzarRuta() {
        if (!confirm("¿Lanzar ruta?")) return;
        await db.from('ruta_activa').delete().not('id', 'is', null);
        const paradas = borrador.map((p, i) => ({ nombre: `${p.nombre} (${p.ubi})`, lat: p.lat, lng: p.lng, orden: i+1, estado: 'Pendiente' }));
        await db.from('ruta_activa').insert(paradas);
        location.href = 'despacho.html';
    }

    init();
</script>
</body>
</html>
