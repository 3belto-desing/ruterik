<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruterik Radar Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --rp-red: #ff3d00;
            --rp-green: #00c853;
            --bg-sidebar: #1a1a1b;
            --bg-body: #0b0b0b;
            --text-main: #fff;
            --border: #333;
        }
        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; font-family: sans-serif; background: var(--bg-body); }
        #sidebar { width: 320px; background: var(--bg-sidebar); border-right: 2px solid var(--border); display: flex; flex-direction: column; color: white; }
        .header { padding: 20px; border-bottom: 3px solid var(--rp-red); }
        #map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        .client-card { background: #222; margin: 10px; padding: 15px; border-radius: 8px; border-left: 5px solid var(--border); }
        .completed { border-left-color: var(--rp-green); opacity: 0.6; }
        .btn-confirm { background: var(--rp-red); color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="header">
            <h2 style="margin:0; color:var(--rp-red);">RUTERIK</h2>
            <div id="status" style="font-size:11px; color:#aaa; margin:10px 0;">Sincronizando GPS...</div>
            <button onclick="location.href='index.html'" style="width:100%; background:#444; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer;">VOLVER</button>
        </div>
        <div id="lista" style="flex:1; overflow-y:auto; padding:10px;"></div>
    </div>
    <div id="map-container"><div id="map"></div></div>

    <script src="rapidpack.shared.js"></script>
    <script src="despacho.js"></script>
</body>
</html>
