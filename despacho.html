<!DOCTYPE html>
<html>
<head>
    <title>RapidPack Live Radar 🛰️</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; display: flex; height: 100vh; background: #1a1a1b; color: white; font-family: sans-serif; }
        #sidebar { width: 300px; padding: 20px; background: #242526; border-right: 2px solid #00c853; }
        #map { flex: 1; }
        .gps-on { color: #00c853; font-weight: bold; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Radar SDE 🚚</h2>
        <p id="status">📡 Buscando señal...</p>
        <hr>
        <div id="lista-clientes"></div>
    </div>
    <div id="map"></div>

<script>
    const db = supabase.createClient("https://trdfieobkewwjhzxwpxc.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk");

    // 1. Inicializar Mapa
    var map = L.map('map').setView([18.4877, -69.8561], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // 2. Icono del Camioncito
    var iconoCamion = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/854/854878.png', 
        iconSize: [45, 45]
    });
    var markerChofer = L.marker([18.4877, -69.8561], {icon: iconoCamion}).addTo(map);

    // 3. Escuchar ubicación en tiempo real
    db.channel('rastreo').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rastreo_chofer' }, payload => {
        const { lat, lng } = payload.new;
        markerChofer.setLatLng([lat, lng]); // Mover el camión
        map.panTo([lat, lng]); // Seguir con la cámara
        document.getElementById('status').innerHTML = "📡 <span class='gps-on'>CHOFER EN VIVO</span>";
    }).subscribe();
</script>
</body>
</html>
