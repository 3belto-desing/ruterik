<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidPack Radar Pro 🛰️</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --rp-red: #ff3d00; --rp-black: #0b0b0b; --rp-grey: #1a1a1b; --rp-green: #00c853; }
        body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: var(--rp-black); display: flex; }
        
        #sidebar { width: 320px; height: 100%; background: var(--rp-grey); color: white; border-right: 2px solid #333; display: flex; flex-direction: column; z-index: 2000; }
        .header { padding: 20px; background: #000; border-bottom: 3px solid var(--rp-red); }
        .route-list { flex: 1; overflow-y: auto; padding: 15px; }

        .btn-delete-fleet {
            background: #b71c1c; color: white; border: none; padding: 10px; 
            width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold;
            font-size: 11px; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 5px;
        }

        #map-container { flex: 1; position: relative; height: 100%; background: #222; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }

        .client-card { background: #222; margin-bottom: 12px; padding: 15px; border-radius: 10px; border-left: 5px solid #555; display: flex; justify-content: space-between; align-items: center; }
        .completed { border-left-color: var(--rp-green) !important; opacity: 0.6; }
        .check { width: 22px; height: 22px; border: 2px solid #555; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .completed .check { background: var(--rp-green); border-color: var(--rp-green); color: black; font-weight: bold; }
        .completed .check::after { content: '✓'; }

        .dist { font-size: 11px; color: var(--rp-red); display: block; margin-top: 4px; font-weight: bold; }
        .tag-live { font-size: 10px; background: var(--rp-green); color: black; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h2 style="margin:0; color:var(--rp-red); font-size: 20px; letter-spacing: 1px;">RAPIDPACK</h2>
            <div id="status" style="font-size: 12px; color: #aaa; margin-top:5px;">🛰️ Buscando señal...</div>
            <button class="btn-delete-fleet" onclick="solicitarPinBorrado()">🗑️ BORRAR RUTA ACTUAL</button>
        </div>
        <div class="route-list" id="lista"></div>
    </div>
    <div id="map-container"><div id="map"></div></div>

<script>
    const db = supabase.createClient("https://trdfieobkewwjhzxwpxc.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk");

    var map = L.map('map', { zoomControl: false }).setView([18.4877, -69.8561], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    var iconoCamion = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/1048/1048329.png', iconSize: [45, 45], iconAnchor: [22, 22] });
    var markerChofer = L.marker([0, 0], { icon: iconoCamion }).addTo(map);
    let clientes = [];
    let markersClientes = [];

    async function solicitarPinBorrado() {
        const pinIngresado = prompt("⚠️ Ingrese el PIN de seguridad para borrar la flota:");
        if (pinIngresado === "2609") {
            if (confirm("¿Estás seguro de limpiar el monitor?")) {
                // CORRECCIÓN AQUÍ: Usamos .not('id', 'is', null) para borrar todo tipo de ID
                const { error } = await db.from('ruta_activa').delete().not('id', 'is', null);
                if (error) alert("Error: " + error.message);
                else { alert("✅ Flota eliminada."); location.reload(); }
            }
        } else if (pinIngresado !== null) alert("❌ PIN Incorrecto.");
    }

    async function cargarDatos() {
        const { data } = await db.from('ruta_activa').select('*').order('orden', { ascending: true });
        clientes = data || [];
        const listaDiv = document.getElementById('lista');
        listaDiv.innerHTML = '';
        markersClientes.forEach(m => map.removeLayer(m));
        markersClientes = [];

        clientes.forEach(c => {
            const isDone = c.estado === 'Entregado';
            listaDiv.innerHTML += `<div class="client-card ${isDone ? 'completed' : ''}"><div><b style="font-size:14px; color:white;">${c.orden}. ${c.nombre}</b><span class="dist" id="d-${c.id}">${isDone ? 'Entregado' : 'Esperando...'}</span></div><div class="check"></div></div>`;
            if (c.lat && c.lat !== 0) {
                const m = L.circleMarker([c.lat, c.lng], { color: isDone ? '#00c853' : '#ff9800', radius: 7, fillOpacity: 0.8 }).addTo(map).bindTooltip(c.nombre);
                markersClientes.push(m);
            }
        });
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371000; 
        const dLat = (lat2-lat1) * Math.PI/180;
        const dLon = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function actualizarGps(lat, lng) {
        if (!lat || lat === 0) return;
        markerChofer.setLatLng([lat, lng]);
        map.panTo([lat, lng]);
        document.getElementById('status').innerHTML = '<span class="tag-live">● EN VIVO</span>';
        for (let c of clientes) {
            if (c.estado !== 'Entregado' && c.lat) {
                const metros = calcularDistancia(lat, lng, c.lat, c.lng);
                const el = document.getElementById(`d-${c.id}`);
                if (el) el.innerText = metros >= 1000 ? `A ${(metros / 1000).toFixed(1)} km` : `A ${metros.toFixed(0)} m`;
                if (metros <= 15) await db.from('ruta_activa').update({ estado: 'Entregado' }).eq('id', c.id);
            }
        }
    }

    db.channel('monitor_pro')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rastreo_chofer', filter: 'id=eq.chofer1' }, p => actualizarGps(p.new.lat, p.new.lng))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ruta_activa' }, () => cargarDatos())
    .subscribe();

    cargarDatos();
</script>
</body>
</html>
