<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidPack Radar Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --rp-red: #ff3d00;
            --rp-green: #00c853;
            --bg-sidebar: #1a1a1b;
            --text-main: #fff;
            --border: #333;
        }
        body.light-mode {
            --bg-sidebar: #ffffff;
            --text-main: #1a1a1b;
            --border: #ddd;
        }
        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            display: flex; font-family: 'Segoe UI', sans-serif; background: #0b0b0b; overflow: hidden;
        }
        #sidebar {
            width: 320px; height: 100vh; background: var(--bg-sidebar);
            color: var(--text-main); border-right: 2px solid var(--border);
            display: flex; flex-direction: column; z-index: 1000;
        }
        #map { flex-grow: 1; height: 100vh; width: 100%; }
        .header { padding: 20px; border-bottom: 2px solid var(--rp-red); }
        .cliente-item {
            padding: 15px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .info-entrega { display: flex; flex-direction: column; gap: 4px; }
        .nombre-cliente { font-weight: bold; font-size: 14px; }
        .distancia-valor { 
            font-size: 12px; 
            color: var(--rp-red); 
            font-weight: bold; 
            background: rgba(255, 61, 0, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            width: fit-content;
        }
        .btn-check {
            background: var(--rp-red); color: white; border: none;
            padding: 10px 14px; border-radius: 6px; cursor: pointer;
            font-weight: bold;
        }
        .secundario {
            background: transparent; color: var(--text-main);
            border: 1px solid var(--border); padding: 8px;
            margin-top: 5px; border-radius: 4px; cursor: pointer; width: 100%;
        }
        #status-gps { font-size: 10px; color: #ffeb3b; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="header">
            <h2 style="color:var(--rp-red); margin:0;">RUTERIK RADAR</h2>
            <div id="status-gps">Esperando GPS...</div>
            <button class="secundario" onclick="toggleTheme()">Modo Claro/Oscuro</button>
            <button class="secundario" onclick="location.href='index.html'">VOLVER</button>
        </div>
        <div id="lista" style="overflow-y:auto; flex:1;"></div>
    </div>
    <div id="map"></div>

    <script src="rapidpack.shared.js"></script>
    <script src="despacho.js"></script>
</body>
</html>
