<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Radar Pro - RapidPack SDE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; position: absolute; }
        .panel { position: absolute; top: 20px; left: 20px; z-index: 1000; background: rgba(0,0,0,0.85); color: white; padding: 15px; border-radius: 12px; border-left: 5px solid #ff3d00; width: 220px; pointer-events: none; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 10px; font-size: 11px; background: #444; margin-top: 5px; }
        .online { background: #00c853; color: black; font-weight: bold; }
    </style>
</head>
<body>
    <div class="panel">
        <h3 style="margin:0;">RapidPack Control</h3>
        <div id="status-tag" class="tag">🛰️ BUSCANDO SEÑAL...</div>
        <div id="entregas" style="font-size: 12px; margin-top: 10px; color: #aaa;">Cargando ruta...</div>
    </div>
    <div id="map"></div>

<script>
    const SB_URL = "https://trdfieobkewwjhzxwpxc.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk";
    const db = supabase.createClient(SB_URL, SB_KEY);

    var map = L.map('map', { zoomControl: false }).setView([18.4877, -69.8561], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    var iconoCamion = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/1048/1048329.png', iconSize: [45, 45] });
    var truckMarker = L.marker([0, 0], { icon: iconoCamion }).addTo(map);
    
    var markersClientes = {}; // Para guardar los puntos de entrega

    async function cargarTodo() {
        // 1. Cargar Chofer
        const { data: gps } = await db.from('rastreo_chofer').select('*').eq('id', 'chofer1').single();
        if (gps) moverCamion(gps.lat, gps.lng);

        // 2. Cargar Ruta (Clientes)
        const { data: ruta } = await db.from('ruta_activa').select('*');
        dibujarRuta(ruta);
    }

    function dibujarRuta(clientes) {
        // Limpiar markers viejos
        Object.values(markersClientes).forEach(m => map.removeLayer(m));
        markersClientes = {};

        let entregados = 0;
        clientes.forEach(c => {
            const color = c.estado === 'Entregado' ? '#00c853' : '#ff9800';
            const m = L.circleMarker([c.lat, c.lng], { color: color, radius: 8, fillOpacity: 0.8 }).addTo(map);
            m.bindTooltip(`<b>${c.orden}. ${c.nombre}</b><br>${c.estado}`);
            markersClientes[c.id] = m;
            if(c.estado === 'Entregado') entregados++;
        });
        document.getElementById('entregas').innerText = `Ruta: ${entregados}/${clientes.length} entregados`;
    }

    function moverCamion(lat, lng) {
        truckMarker.setLatLng([lat, lng]);
        document.getElementById('status-tag').innerText = "🟢 CHOFER EN VIVO";
        document.getElementById('status-tag').className = "tag online";
    }

    // --- ESCUCHAR TODO EN VIVO ---
    db.channel('radar')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rastreo_chofer' }, payload => {
        moverCamion(payload.new.lat, payload.new.lng);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ruta_activa' }, () => {
        cargarTodo(); // Recarga los puntos si lanzas una ruta o se entrega algo
    })
    .subscribe();

    cargarTodo();
</script>
</body>
</html>
