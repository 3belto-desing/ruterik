<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidPack Radar Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --rp-red: #ff3d00;
            --rp-green: #00c853;
            --bg-sidebar: #1a1a1b;
            --bg-header: #000;
            --bg-body: #0b0b0b;
            --text-main: #fff;
            --border: #333;
        }
        body.light-mode {
            --bg-sidebar: #ffffff;
            --bg-header: #ffffff;
            --bg-body: #f0f0f5;
            --text-main: #1a1a1b;
            --border: #ddd;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-body);
            display: flex;
        }
        #sidebar {
            width: 320px;
            height: 100%;
            background: var(--bg-sidebar);
            color: var(--text-main);
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 2000;
            transition: 0.3s;
        }
        .header {
            padding: 20px;
            background: var(--bg-header);
            border-bottom: 3px solid var(--rp-red);
        }
        .route-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .btn-theme {
            background: var(--border);
            color: var(--text-main);
            border: none;
            padding: 8px;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            font-size: 11px;
        }
        .btn-delete {
            background: #b71c1c;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }
        .btn-confirm {
            background: var(--rp-red);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        #monitor-error {
            display: none;
            margin: 10px 0;
            font-size: 11px;
            color: #ff8a80;
            line-height: 1.4;
        }
        #driver-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 11px;
            color: #aaa;
            margin: 10px 0;
        }
        #map-container {
            flex: 1;
            position: relative;
            height: 100%;
            background: #222;
        }
        #map {
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        .client-card {
            background: var(--bg-sidebar);
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid var(--border);
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .completed {
            border-left-color: var(--rp-green) !important;
            opacity: 0.6;
        }
        .check {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .completed .check {
            background: var(--rp-green);
            color: black;
            font-weight: bold;
            border-color: var(--rp-green);
        }
        .completed .check::after {
            content: 'OK';
        }
        .dist {
            font-size: 11px;
            color: var(--rp-red);
            font-weight: bold;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="header">
            <h2 style="margin:0; color:var(--rp-red); font-size:20px; letter-spacing:1px;">RAPIDPACK</h2>
            <div id="status" style="font-size:11px; color:#aaa; margin:10px 0;">Conectando con satelite...</div>
            <div id="driver-meta">
                <span>Ultima conexion: <b id="last-seen">Sin datos</b></span>
                <span>Precision: <b id="gps-accuracy">N/D</b></span>
            </div>
            <div id="monitor-error"></div>
            <button class="btn-theme" onclick="toggleTheme()">Cambiar modo</button>
            <button class="btn-delete" onclick="solicitarPinBorrado()">BORRAR RUTA ACTUAL</button>
        </div>
        <div class="route-list" id="lista">
            <p style="text-align:center; color:#666;">Cargando ruta activa...</p>
        </div>
    </div>
    <div id="map-container"><div id="map"></div></div>

    <script src="rapidpack.shared.js"></script>
    <script src="despacho.js"></script>
</body>
</html>
