<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidPack Radar Pro 🛰️</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --rp-red: #ff3d00; --rp-green: #00c853;
            --bg-sidebar: #1a1a1b; --bg-header: #000; --bg-body: #0b0b0b; --text-main: #fff; --border: #333;
        }
        body.light-mode {
            --bg-sidebar: #ffffff; --bg-header: #ffffff; --bg-body: #f0f0f5; --text-main: #1a1a1b; --border: #ddd;
        }
        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: var(--bg-body); display: flex; }
        
        /* Sidebar */
        #sidebar { width: 320px; height: 100%; background: var(--bg-sidebar); color: var(--text-main); border-right: 2px solid var(--border); display: flex; flex-direction: column; z-index: 2000; transition: 0.3s; }
        .header { padding: 20px; background: var(--bg-header); border-bottom: 3px solid var(--rp-red); }
        .route-list { flex: 1; overflow-y: auto; padding: 15px; }

        /* Botones */
        .btn-theme { background: var(--border); color: var(--text-main); border: none; padding: 8px; border-radius: 15px; cursor: pointer; width: 100%; margin-bottom: 10px; font-size: 11px; }
        .btn-delete { background: #b71c1c; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }

        /* Mapa */
        #map-container { flex: 1; position: relative; height: 100%; background: #222; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1; }

        /* Tarjetas */
        .client-card { background: var(--bg-sidebar); margin-bottom: 12px; padding: 15px; border-radius: 10px; border-left: 5px solid var(--border); border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .completed { border-left-color: var(--rp-green) !important; opacity: 0.6; }
        .check { width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .completed .check { background: var(--rp-green); color: black; font-weight: bold; border-color: var(--rp-green); }
        .completed .check::after { content: '✓'; }
        .dist { font-size: 11px; color: var(--rp-red); font-weight: bold; display: block; margin-top: 4px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="header">
            <h2 style="margin:0; color:var(--rp-red); font-size: 20px; letter-spacing: 1px;">RAPIDPACK</h2>
            <div id="status" style="font-size: 11px; color: #aaa; margin: 10px 0;">🛰️ Conectando con satélite...</div>
            <button class="btn-theme" onclick="toggleTheme()">🌓 Cambiar Modo</button>
            <button class="btn-delete" onclick="solicitarPinBorrado()">🗑️ BORRAR RUTA ACTUAL</button>
        </div>
        <div class="route-list" id="lista">
            <p style="text-align:center; color:#666;">Cargando ruta activa...</p>
        </div>
    </div>
    <div id="map-container"><div id="map"></div></div>

<script>
    // 1. Configuración de Supabase
    const supabaseUrl = "https://trdfieobkewwjhzxwpxc.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk";
    const db = supabase.createClient(supabaseUrl, supabaseKey);
    
    let map, currentTileLayer, markerChofer;
    let clientes = [];
    let markersClientes = [];

    const darkMap = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
    const lightMap = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';

    // 2. Inicializar Mapa con Seguridad
    function initMap() {
        try {
            const isLight = localStorage.getItem('rp-theme') === 'light';
            if(isLight) document.body.classList.add('light-mode');

            map = L.map('map', { zoomControl: false }).setView([18.4877, -69.8561], 13);
            currentTileLayer = L.tileLayer(isLight ? lightMap : darkMap).addTo(map);

            const iconoCamion = L.icon({ 
                iconUrl: 'https://cdn-icons-png.flaticon.com/512/1048/1048329.png', 
                iconSize: [40, 40], 
                iconAnchor: [20, 20] 
            });
            markerChofer = L.marker([0, 0], { icon: iconoCamion }).addTo(map);
            
            console.log("✅ Mapa inicializado correctamente");
        } catch (e) {
            console.error("❌ Error al cargar el mapa:", e);
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem('rp-theme', isLight ? 'light' : 'dark');
        if (map) {
            map.removeLayer(currentTileLayer);
            currentTileLayer = L.tileLayer(isLight ? lightMap : darkMap).addTo(map);
        }
    }

    // 3. Cargar Datos de la Flota
    async function cargarDatos() {
        try {
            const { data, error } = await db.from('ruta_activa').select('*').order('orden', { ascending: true });
            if (error) throw error;

            clientes = data || [];
            const listaDiv = document.getElementById('lista');
            listaDiv.innerHTML = clientes.length ? '' : '<p style="text-align:center; color:#666;">No hay ruta activa</p>';
            
            // Limpiar markers anteriores
            markersClientes.forEach(m => map.removeLayer(m));
            markersClientes = [];

            clientes.forEach(c => {
                const isDone = c.estado === 'Entregado';
                listaDiv.innerHTML += `
                    <div class="client-card ${isDone ? 'completed' : ''}">
                        <div>
                            <b style="font-size:14px;">${c.orden}. ${c.nombre}</b>
                            <span class="dist" id="dist-${c.id}">${isDone ? 'Entregado' : 'Calculando...'}</span>
                        </div>
                        <div class="check"></div>
                    </div>
                `;

                if (c.lat && c.lat !== 0) {
                    const m = L.circleMarker([c.lat, c.lng], { 
                        color: isDone ? '#00c853' : '#ff9800', 
                        radius: 8, 
                        fillOpacity: 0.8 
                    }).addTo(map).bindTooltip(c.nombre);
                    markersClientes.push(m);
                }
            });
            console.log("✅ Datos cargados:", clientes.length, "clientes");
        } catch (err) {
            console.error("❌ Error cargando datos:", err.message);
        }
    }

    // 4. Lógica de Distancia y GPS
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371000; 
        const dLat = (lat2-lat1) * Math.PI/180;
        const dLon = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function actualizarGps(lat, lng) {
        if (!lat || lat === 0 || !markerChofer) return;

        markerChofer.setLatLng([lat, lng]);
        document.getElementById('status').innerHTML = '🟢 UNIDAD EN LÍNEA - SDE';

        for (let c of clientes) {
            if (c.estado !== 'Entregado' && c.lat) {
                const m = calcularDistancia(lat, lng, c.lat, c.lng);
                const el = document.getElementById(`dist-${c.id}`);
                if (el) {
                    el.innerText = m >= 1000 ? `A ${(m/1000).toFixed(1)} km` : `A ${m.toFixed(0)} metros`;
                }
                // Auto-check a 20 metros
                if (m <= 20) {
                    await db.from('ruta_activa').update({ estado: 'Entregado' }).eq('id', c.id);
                }
            }
        }
    }

    async function solicitarPinBorrado() {
        if (prompt("PIN DE SEGURIDAD:") === "2609") {
            const { error } = await db.from('ruta_activa').delete().not('nombre', 'is', null);
            if (!error) location.reload();
        }
    }

    // 5. Encender Motores
    window.onload = () => {
        initMap();
        cargarDatos();

        // Escuchar cambios en la ruta (Realtime)
        db.channel('monitor_ruta')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'ruta_activa' }, () => {
                console.log("🔄 Cambio detectado en ruta_activa");
                cargarDatos();
            })
            .subscribe();

        // Escuchar movimiento del chofer
        db.channel('monitor_gps')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rastreo_chofer' }, p => {
                console.log("🚚 Chofer moviéndose:", p.new.lat, p.new.lng);
                actualizarGps(p.new.lat, p.new.lng);
            })
            .subscribe();
    };
</script>
</body>
</html>
