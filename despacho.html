<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RUTERIK - Radar Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --rp-red: #ff3d00; --bg-sidebar: #1a1a1b; --text-main: #fff; }
        body.light-mode { --bg-sidebar: #fff; --text-main: #000; }
        body, html { margin:0; padding:0; height:100vh; display:flex; font-family: sans-serif; overflow:hidden; }
        #sidebar { width: 300px; background: var(--bg-sidebar); color: var(--text-main); border-right: 2px solid #333; display:flex; flex-direction:column; transition: 0.3s; }
        #map { flex: 1; background: #0b0b0b; }
        .header { padding: 20px; border-bottom: 2px solid var(--rp-red); }
        .cliente-item { padding: 15px; border-bottom: 1px solid #333; display:flex; justify-content: space-between; align-items: center; }
        .btn-check { background: var(--rp-red); color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="header">
            <h2 style="color:var(--rp-red); margin:0;">RUTERIK RADAR</h2>
            <button onclick="toggleTheme()" style="margin-top:10px; width:100%;">Modo Claro/Oscuro</button>
            <button onclick="location.href='index.html'" style="margin-top:5px; width:100%;">VOLVER</button>
        </div>
        <div id="lista" style="overflow-y:auto; flex:1;"></div>
    </div>
    <div id="map"></div>

    <script src="rapidpack.shared.js"></script>
    <script src="despacho.js"></script>
</body>
</html>
