    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #111; }
        
        /* Mapa a pantalla completa */
        #map { width: 100vw; height: 100vh; z-index: 1; }

        /* Panel de Control Flotante */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(20, 20, 22, 0.9);
            color: white;
            padding: 20px;
            border-radius: 15px;

            width: 280px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #333;
            margin-top: 10px;
        }

        .online { background: #00c853; color: black; box-shadow: 0 0 15px #00c853; }
        
        h2 { margin: 0; font-size: 20px; color: #ff3d00; letter-spacing: 1px; }
        p { margin: 5px 0; font-size: 14px; color: #ccc; }
    </style>
</head>
