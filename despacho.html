<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ruterik - Monitor en Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1b; color: white; padding: 20px; }
        .cliente { background: #2d2d2e; padding: 20px; border-radius: 10px; margin-bottom: 10px; border-left: 10px solid #444; display: flex; justify-content: space-between; align-items: center;}
        .entregado { border-left-color: #00c853; opacity: 0.5; }
        .check { font-size: 25px; }
        .gps-box { background: #00c853; color: black; padding: 10px; border-radius: 10px; font-weight: bold; position: fixed; top: 20px; right: 20px; }
    </style>
</head>
<body>
    <h1>📊 Seguimiento de Entregas RapidPack</h1>
    <div id="gps-status" class="gps-box">📡 GPS: Esperando chofer...</div>
    <div id="monitor"></div>

<script>
    const SB_URL = "https://trdfieobkewwjhzxwpxc.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGZpZW9ia2V3d2poenh3cHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4ODYyMTAsImV4cCI6MjA4ODQ2MjIxMH0.aU6dMbELmJRAVmdGVqkHwy60Mth8jaGkeaHVjrGqRZk";
    const db = supabase.createClient(SB_URL, SB_KEY);

    async function cargarMonitor() {
        const { data } = await db.from('ruta_activa').select('*').order('orden');
        const div = document.getElementById('monitor');
        div.innerHTML = "";
        data.forEach(c => {
            const esOk = c.estado === 'Entregado';
            div.innerHTML += `
                <div class="cliente ${esOk ? 'entregado' : ''}">
                    <div>
                        <b style="font-size:20px;">${c.orden}. ${c.nombre}</b><br>
                        <small>${c.nota_entrega || ''}</small>
                    </div>
                    <div class="check">${esOk ? '✅' : '🚚'}</div>
                </div>`;
        });
    }

    // Escuchar GPS del Chofer para el AUTO-CHECK ✅
    db.channel('gps').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rastreo_chofer' }, async (payload) => {
        const g = payload.new;
        document.getElementById('gps-status').innerText = `📡 GPS: Conectado (${new Date().toLocaleTimeString()})`;
        
        // Lógica de cercanía (Si el chofer está a menos de 100 metros)
        const { data: ruta } = await db.from('ruta_activa').select('*').eq('estado', 'Pendiente');
        for(let c of ruta) {
            const d = Math.sqrt(Math.pow(c.lat - g.lat, 2) + Math.pow(c.lng - g.lng, 2));
            if(d < 0.0009) { // Aproximadamente 100 metros
                await db.from('ruta_activa').update({ estado: 'Entregado' }).eq('id', c.id);
            }
        }
    }).subscribe();

    // Recargar lista si algo cambia
    db.channel('ruta').on('postgres_changes', { event: '*', schema: 'public', table: 'ruta_activa' }, cargarMonitor).subscribe();

    cargarMonitor();
</script>
</body>
</html>
